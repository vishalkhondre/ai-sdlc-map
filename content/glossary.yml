# Terminology and where it comes from.
#
# attribution:
#   adopted  — the term and its meaning come from `source`; cite it where used
#   adapted  — the idea comes from `source`; this site uses a different word or a narrower meaning
#   coined   — a working name introduced by this site
#   common   — ordinary engineering vocabulary, no single source
#
# `match` lists phrases the generator auto-links (first occurrence per chapter).
# `counterpart` names the nearest term in Böckeler's harness-engineering vocabulary,
# so readers moving between the two can translate.

- id: ai-sdlc
  term: AI SDLC
  attribution: common
  also: [ibm-ai-lifecycle, ibm-ai-dlc, aws-ai-dlc]
  definition: >-
    The software development lifecycle (SDLC) with AI agents doing part of the work in every phase,
    from intent and specification through design, build, verification, release and operation, while
    deterministic checks and human decisions stay where they are needed. Not to be confused with two
    nearby uses. First, the lifecycle for building AI and machine-learning systems themselves: data
    preparation, model training and evaluation, deployment and monitoring for drift, which IBM calls the
    AI lifecycle. Second, the AI-Driven Development Lifecycle (AI-DLC), one vendor's named methodology:
    AWS structures it as Inception, Construction and Operations phases in which AI proposes a plan and
    asks clarifying questions, and people approve. This site uses the plain term for the lifecycle and
    does not follow any one methodology. The term is written without a hyphen.
  match: ["AI SDLC"]

- id: harness
  term: Harness
  attribution: adopted
  source: bockeler-harness
  also: [bockeler-context]
  definition: >-
    Everything in a coding agent except the model itself: the context it reads, the tools it can
    call, the permissions that bound it, the checks that run on its output and the record of what it did.
    Böckeler's formulation is "Agent = Model + Harness". This site uses the wide sense — the whole
    engineering environment around the agent — rather than the narrow sense of the scaffolding around one model call.
  match: ["agent harness", "the harness"]

- id: harness-engineering
  term: Harness engineering
  attribution: adopted
  source: bockeler-harness
  also: [openai-harness]
  definition: >-
    The practice of deliberately designing and maintaining the harness: what the agent can discover,
    what it can do, how its work is checked and when a person needs to decide. Böckeler frames it as
    building trust in coding agents through systematic controls; one model vendor's account describes the same
    work applied to one large codebase. Here it is the discipline, distinct from the artefact
    (Engineering Kit), the unit (workflow) and the operating state (software factory).
  match: ["harness engineering"]

- id: guides-and-sensors
  term: Guides and sensors
  attribution: adopted
  source: bockeler-harness
  definition: >-
    Böckeler's two kinds of control. Guides are feedforward: they anticipate the agent's behaviour and
    steer it before it acts (instructions, constitutions, skills, templates). Sensors are feedback: they
    observe after the agent acts and help it self-correct (tests, linters, type checkers, AI review).
    The site's own vocabulary uses other words, but the split runs through it: skills and constitutions are guides;
    validators, tests and the review skill are sensors.
  counterpart: "guides ↔ skills, constitution, readiness questions; sensors ↔ validators, tests, review skill"

- id: two-kinds-of-machinery
  term: Two kinds of machinery (probabilistic and deterministic)
  attribution: adapted
  source: bockeler-harness
  definition: >-
    Probabilistic machinery understands intent, explores code, proposes designs and summarises evidence;
    deterministic machinery compiles, runs tests, enforces dependency rules and blocks invalid builds.
    Böckeler draws the same line as computational controls (deterministic, fast, run by the CPU) versus
    inferential controls (semantic analysis, AI review, LLM-as-judge). The rule here is that final
    enforcement belongs with the deterministic side wherever a machine can check reliably.
  counterpart: "computational ↔ deterministic; inferential ↔ probabilistic"
  match: ["deterministic machinery", "probabilistic machinery", "two kinds of machinery"]

- id: steering-loop
  term: Steering loop
  attribution: adopted
  source: bockeler-harness
  definition: >-
    Böckeler's name for the human practice of iteratively improving guides and sensors based on recurring
    agent failures. This site calls the same thing the feedback path, and enumerates its conversions:
    defect → test, recurring comment → rule, violated rule → gate, production failure → eval case.
  counterpart: "steering loop ↔ feedback path"

- id: feedback-path
  term: Feedback path
  attribution: adapted
  source: bockeler-harness
  definition: >-
    The defined place each lesson goes. A defect becomes a regression test. A recurring review comment
    becomes a rule. A rule that keeps being violated becomes a deterministic gate. A production failure
    becomes an evaluation case. A misunderstood requirement becomes a readiness question. A repeated
    procedure becomes a skill. A brittle agent behaviour becomes a change to the harness. The change lands
    upstream of where the problem appeared.
  match: ["feedback path", "one feedback path"]

- id: harnessability
  term: Harnessability
  attribution: adopted
  source: bockeler-harness
  definition: >-
    The degree to which a codebase supports building a harness: typed languages, well-defined boundaries
    and a runnable local environment make sensors cheap to add.

- id: harness-template
  term: Harness template
  attribution: adopted
  source: bockeler-harness
  definition: >-
    Böckeler's proposal for bundles of guides and sensors standardised for common service topologies.
    The Engineering Kit's technology profiles (validators and guidance per supported stack) are one
    concrete form of this idea, with a rule registry and evidence schema added underneath.
  counterpart: "harness template ↔ Engineering Kit technology profile"

- id: technology-profile
  term: Technology profile
  attribution: coined
  definition: >-
    The Engineering Kit layer that packages what one supported stack needs: its validators, pinned tool
    versions, skills, scaffolds and default thresholds. It adds rules and checks for its stack; it does
    not change what the shared core's rules mean and carries no one project's choices. One concrete form
    of what Böckeler proposes as a harness template.
  counterpart: "technology profile ↔ harness template"
  match: ["technology profile", "technology profiles"]

- id: project-configuration
  term: Project configuration
  attribution: coined
  definition: >-
    The Engineering Kit layer where one project supplies meaning, as a committed, reviewed file: which
    rules apply and which checks run for each kind of change, thresholds within the bounds the core or
    profile allows, exceptions with an owner and expiry, and the chosen profile and adapters. It cannot
    change the evidence schema, redefine a result state or waive a rule the core marks as never open to
    exception.
  match: ["project configuration"]

- id: golden-path
  term: Golden path
  attribution: adopted
  source: spotify-golden-paths
  also: [cncf-platforms, dora-platform-engineering]
  definition: >-
    The opinionated, supported way to build a kind of system that a platform offers its users, with
    templates and documentation, so that each team does not assemble its own tooling. Associated with
    Spotify's engineering writing and used in the CNCF platforms white paper and by DORA. An Engineering
    Kit's technology profiles play a similar part for the harness around a coding agent.
  match: ["golden path", "golden paths"]

- id: engineering-kit
  term: Engineering Kit
  attribution: coined
  definition: >-
    A working name, used on this site, for a versioned, installable package of the engineering environment
    a team wants its people and its coding agents to operate inside: rule registry, validators, skills with
    evaluation scenarios, evidence schema and thin tool adapters, organised in four layers (shared core,
    technology profiles, tool adapters, project configuration) and run through three commands: init
    (install), doctor (check prerequisites) and verify (run the declared checks and write the evidence
    record, the same way locally and in CI). Not an industry term.
  match: ["Engineering Kit"]

- id: rule-registry
  term: Rule registry
  attribution: coined
  definition: >-
    One entry per rule the team cares about, with an identifier, a statement, how the rule is
    enforced (the checks that enforce it, the person who decides on it, or both), an owner and known
    gaps. Validators declare which rules they enforce, skills which rules
    they support, evidence which rule checks ran. The connecting structure of the kit.
  match: ["rule registry"]

- id: architecture-decision-record
  term: Architecture decision record
  attribution: adopted
  source: nygard-adr
  also: [tw-radar-adr]
  definition: >-
    Michael Nygard's short record of one architecturally significant decision: its title, context,
    the decision, its status and its consequences. Records are numbered in sequence, numbers are
    not reused, and a reversed decision is kept and marked superseded rather than edited. This site
    uses the same pattern for the history of each rule in the rule registry.
  match: ["architecture decision record", "architecture decision records"]

- id: gate
  term: Gate (deterministic gate)
  attribution: common
  also: [fowler-ci, fitness-function, ford-evolutionary-architectures]
  definition: >-
    A check that runs on the output and can stop it: the kit's verify command before a push, required checks
    on a pull request, policy rules at release. Different from an instruction because it refuses rather
    than asks. Architecture gates are what evolutionary-architecture practice calls fitness functions.
  match: ["deterministic gate", "deterministic gates"]

- id: fitness-function
  term: Fitness function (architectural)
  attribution: adopted
  source: ford-evolutionary-architectures
  also: [thoughtworks-radar-fitness, fitness-function]
  definition: >-
    From evolutionary-architecture practice (Ford, Parsons and Kua, Building Evolutionary
    Architectures), which borrows the idea from evolutionary computing: an objective assessment of
    how well a system preserves an architectural characteristic, carried out through tests, metrics,
    monitoring and similar mechanisms. On this site, an architecture rule expressed as a fitness
    function that runs with the build is a validator, and an architecture gate once it blocks.
  match: ["fitness function", "fitness functions", "architectural fitness function"]

- id: deterministic-gate
  term: Deterministic floor
  attribution: coined
  definition: >-
    The minimum a kit's first release needs before any skill: a verify command that runs the same way
    locally and in CI, a few validators, a rule
    registry and an evidence schema. Dull, and the only part that makes the rest safe.
  match: ["deterministic floor"]

- id: validator
  term: Validator
  attribution: adapted
  source: bockeler-sensors
  definition: >-
    A deterministic check tied to a rule identifier. Runs the same way locally and in CI, returns
    passed / failed / skipped / could_not_run, and can block a merge. Ships when it runs reliably and
    its failures are actionable. Böckeler's computational sensors (linters, type checks, dependency
    rules, SAST, mutation testing) are validators.
  counterpart: "validator ↔ computational sensor"
  match: ["validators", "validator"]

- id: skill
  term: Skill
  attribution: common
  also: [bockeler-context, anthropic-agent-skills, github-agent-skills]
  definition: >-
    Guidance the agent loads on demand, tied to rule identifiers, that shapes what it tries to do without
    guaranteeing it. Probabilistic. Ships only with an evaluation history. In Böckeler's terms, a guide.
  counterpart: "skill ↔ guide (feedforward control)"
  match: ["reusable skill", "skill manifest"]

- id: review-skill
  term: Review skill
  attribution: adapted
  source: bockeler-sensors
  definition: >-
    An agent that reads a diff against the applicable rules and produces findings tagged to rule
    identifiers. On this site it proposes and cannot block. Böckeler's inferential sensors (AI security review,
    modularity review) are the same kind of thing.
  counterpart: "review skill ↔ inferential sensor"
  match: ["review skill", "reviewing agent"]

- id: harness-evaluation
  term: Harness evaluation (eval)
  attribution: common
  also: [anthropic-agent-evals]
  definition: >-
    A scenario that tests whether the agent and its environment behave as intended: given a spec with an
    unresolved access rule, does the agent stop and ask? Distinct from application tests. Repeated when
    prompts, skills, tools or models change. This site treats eval history as the bar for shipping a skill.
  match: ["harness evaluations", "evaluation case", "eval suite"]

- id: llm-as-a-judge
  term: LLM-as-a-judge
  attribution: adopted
  source: zheng-llm-judge
  definition: >-
    Using a language model to grade the output of another model or agent, as studied by Zheng et al.
    (2023). Flexible and scalable, but itself non-deterministic and subject to position, verbosity and
    self-enhancement biases, so its grades are checked against human judgement before they are relied on.
    In an eval set it is one kind of grader, alongside code-based checks and human review.
  match: ["LLM-as-a-judge"]

- id: evidence-record
  term: Evidence record
  attribution: coined
  definition: >-
    What a run records in one fixed shape, as a by-product of the run rather than a report written
    afterwards: schema version, change and configuration revisions, kit version, the checks expected
    before the run, each check's result with its rule ID, status and report link, agent findings,
    decisions pending and taken, and an overall status derived from the rest. Each field has one kind
    of writer (the kit, a validator, an agent or a named person). Its schema is fixed by the kit and
    is the one thing a project cannot customise.
  match: ["evidence record", "evidence schema"]

- id: could-not-run
  term: could_not_run
  attribution: coined
  also: [sarif-2-1-0, python-unittest]
  definition: >-
    A first-class result state, distinct from failed and skipped: the check was required but its
    prerequisite was missing (a tool absent from the runner image, an environment unavailable), it timed
    out again after one retry, or the tool itself crashed. It is never reported as passed or skipped;
    what it means for a merge or release is decided in assurance. Without it, the first broken runner
    quietly turns every gate it hosts into a suggestion.
    The name is this site's; the distinction is established, for example in SARIF's record of whether a
    tool's execution succeeded, and in test frameworks that report errors apart from failures.
  match: ["could_not_run", "could not run"]

- id: adapter
  term: Adapter
  attribution: adapted
  source: cockburn-hexagonal
  definition: >-
    The thin binding between the kit's core and one tool: an execution surface (where the agent runs),
    a change host (where the pull request lives), a pipeline runner (where checks run unattended), a
    work tracker, or a tool server the agent calls. It translates; it holds no rules, validator logic or
    schema. The test of an adapter is how little is in it. Adapted from Alistair Cockburn's ports and
    adapters pattern (see that entry): his adapters sit at an application's ports, and this site
    applies the idea to the one layer of a kit that talks to outside tools.
  match: ["tool adapters", "thin adapters"]

- id: ports-and-adapters
  term: Ports and adapters
  attribution: adopted
  source: cockburn-hexagonal
  definition: >-
    Alistair Cockburn's architecture pattern, also called hexagonal architecture: an application
    talks to the outside world only through ports, and a technology-specific adapter at each port
    translates between the outside device and the application, so the application can be driven
    by people, programs or tests and developed apart from the devices and databases it runs
    against. The Engineering Kit's tool adapters apply the same idea to the tools a kit runs against.
  match: ["ports and adapters", "hexagonal architecture"]

- id: anticorruption-layer
  term: Anticorruption layer
  attribution: adopted
  source: evans-ddd-reference
  definition: >-
    Eric Evans's domain-driven design pattern: an isolating layer that talks to another system
    through its existing interface and translates between the two models, so the other system's
    concepts do not reshape the model that uses it. A kit's adapters play this part between the
    kit's core and a tool's own vocabulary.
  match: ["anticorruption layer", "anti-corruption layer"]

- id: contract-test
  term: Contract test
  attribution: adopted
  source: fowler-contract-test
  definition: >-
    Martin Fowler's name for a test that checks a test double still behaves like the real
    outside service it stands in for. It runs apart from the main build, at the pace the outside
    service changes. On this site, the contract suite a kit's core defines for each kind of
    adapter is the same idea pointed at the kit's own interface.
  match: ["contract test", "contract tests"]

- id: consumer-driven-contract
  term: Consumer-driven contract
  attribution: adopted
  source: robinson-cdc
  definition: >-
    Ian Robinson's service-evolution pattern: the consumers of a service state their
    expectations as tests, and the provider is checked against all of them, so it can change
    without breaking any consumer.
  match: ["consumer-driven contract", "consumer-driven contracts"]

- id: mechanism-vs-meaning
  term: Mechanism versus meaning
  attribution: coined
  definition: >-
    The kit supplies reusable mechanism (a test pattern, a runner, a rule identifier); the project supplies
    the meaning those mechanisms must preserve (which identities may export which records, which fields are
    excluded). A kit cannot infer product decisions because it has an authorization skill.
  match: ["mechanism", "project intent"]

- id: workflow
  term: Workflow
  attribution: coined
  definition: >-
    One delivery decision run end to end: a trigger, inputs, an agent task, automated checks, guardrails,
    a human decision, outputs, feedback and an owner. A team has one when every qualifying change goes
    through it and leaves a record that the next decision reads.
  match: ["a workflow"]

- id: three-roles
  term: Three roles (agent, checks, people)
  attribution: coined
  definition: >-
    The agent does what is expensive for a person and tolerable to get slightly wrong. The checks do what
    must not be wrong. The people do what needs context the workflow cannot hold. Workflows fail when these
    blur: an agent treated as verifier, or people treated as checks.

- id: risk-tier
  term: Risk tier
  attribution: common
  also: [istqb-rbt, iso-29119-1, istqb-risk-level]
  definition: >-
    The level of risk recorded for a change, judged from the impact and likelihood of getting it wrong,
    which decides which checks a workflow run selects and who is asked to decide, while the workflow's
    definition stays the same. It applies risk-based testing to delivery. The agent may propose a tier,
    a person confirms it at specification readiness, and it is revisited when what is known about the
    change moves.
  match: ["risk tier"]

- id: failure-path
  term: Failure path
  attribution: coined
  definition: >-
    A defined response to an interruption: a check detects a violation, a required check cannot run, a
    requirement is ambiguous, an agent finding is rejected, an exception is requested. A test failure and an
    unavailable environment need different responses; treating either as a pass misrepresents the evidence.
  match: ["failure paths"]

- id: evidence-handoff
  term: Evidence hand-off
  attribution: coined
  definition: >-
    Workflows are built one at a time but read each other's records: the readiness record configures
    verification, the verification record feeds release readiness, the release record is what an incident
    review reads. Evidence carries its scope with it and expires when the revision changes.
  match: ["hand each other evidence"]

- id: software-factory
  term: Software factory
  attribution: coined
  also: [cusumano-software-factories, greenfield-software-factories, shapiro-five-levels, willison-software-factory]
  definition: >-
    Not a product or a platform: the operating state that appears when enough workflows share rules,
    evidence and feedback, so that what production teaches changes what specification asks. Coined in
    this sense. Earlier uses of the phrase mean something else: Cusumano (1991) for Japanese firms that
    applied production-management discipline to large-scale software development, and Greenfield and
    Short (2004) for model-driven production of variants of a standard product. Recent writing on the
    "dark software factory", where agents produce software that no person reviews, is not what is meant
    either, nor is the industrial sense of identical outputs from a fixed process.
  match: ["software factory"]

- id: review-fatigue
  term: Review fatigue
  attribution: common
  also: [parasuraman-manzey-2010, yu-habituation-2026]
  definition: >-
    Falling scrutiny in review as more agent output and evidence reach the same few approvers: more is
    approved, fewer comments are written, and less of each change is read with care. Research on
    automation finds that attention to an automated aid slips under heavy task load, and a 2026
    preprint on repeat reviewers of agent-authored pull requests reports approval rising while inline
    comments fell over several months, a pattern its authors read as habituation without claiming cause.
  match: ["review fatigue"]

- id: skill-erosion
  term: Skill erosion
  attribution: common
  definition: >-
    What happens when agents do all the implementation and all the first drafts: the team stops getting
    the unaided repetitions that keep judgment sharp, and the factory depends on that judgment at every
    human decision point.
  match: ["skill erosion"]

- id: spec-driven-development
  term: Spec-driven development
  attribution: adopted
  source: spec-kit
  definition: >-
    Making expected behaviour and constraints explicit before implementation, in a sequence from intent
    through specification, plan and tasks, with clarification added where the specification leaves
    questions open. This site treats it as the process spine the harness wraps around, and stays neutral
    on which tool supplies it.
  match: ["Spec-Driven Development", "spec-driven development", "spec-driven flow"]

- id: specification-readiness
  term: Specification readiness
  attribution: coined
  definition: >-
    Enough clarity to proceed responsibly, with remaining uncertainty made visible. A workflow whose
    trigger is a spec marked ready for planning, whose checks are structural, whose decision is the product
    owner's, and whose output is a readiness record later workflows read.
  match: ["specification readiness", "readiness record"]

- id: independent-basis
  term: Independent basis for verification
  attribution: coined
  definition: >-
    If an agent generates both the implementation and its tests from the same incomplete understanding,
    both may share the same mistaken assumption. Verification needs something defined apart from the
    implementation: acceptance criteria, access rules, interface contracts, representative data, failure scenarios.
  match: ["independent basis"]

- id: export-example
  term: The export example
  attribution: coined
  definition: >-
    The running hypothetical: a feature that lets users export customer records. Open decisions (which
    records, which fields, large exports, failure, audit), an access rule (R-042 / SEC-004), a background
    worker with a broader query, a 50k-row load scenario, a volume-limit rule (R-017). It is the site's one
    worked example: a page that needs an example follows this change, so the abstractions can be checked
    against one story.
  match: ["customer-record export", "export feature"]

- id: requisite-variety
  term: Requisite variety
  attribution: adopted
  source: ashby
  also: [bockeler-harness]
  definition: >-
    Ashby's law: a regulator can only control a system if it has at least as much variety as the system
    it governs. Böckeler uses it to explain why committing to a narrow topology makes an agent easier to
    harness: restricting what the agent may produce shrinks the space the controls must cover. The law
    does not say fewer controls are better. This site's recommendation follows from shrinking what is
    governed: narrow what the agent may produce first, on a few well-defined execution surfaces, then
    start with a small set of controls fitted to failures actually seen.

- id: lifecycle-levels
  term: Portfolio, train and team levels
  attribution: coined
  definition: >-
    One delivery lifecycle seen at three altitudes: portfolio, train and team. A portfolio decides which
    initiatives to fund, in what order and with what budget. A train decides which features enter a
    planning cycle and what an integrated demonstration shows. A team decides which stories to build in
    an iteration and when work counts as ready and as done. Intent and rules flow down the levels;
    evidence and lessons flow up. The three labels are generic names introduced by this site. SAFe names
    the same altitudes Portfolio, Agile Release Train and Agile Team and is cited as one framework that
    uses them, not as the source of the labels.
  match: ["lifecycle levels", "portfolio, train and team"]

- id: agile-release-train
  term: Agile Release Train (ART)
  attribution: adopted
  source: safe-art
  definition: >-
    SAFe's name for the train level: "a long-lived team of Agile teams that incrementally develops,
    delivers, and often operates one or more solutions in a development value stream". Credited to
    Scaled Agile, Inc.; this site uses "train" as the generic label for the same altitude.
  match: ["Agile Release Train"]

- id: planning-interval
  term: Planning Interval (PI)
  attribution: adopted
  source: safe-framework
  definition: >-
    SAFe's name for the planning cycle of a train: "a cadence-based timebox in which Agile Release
    Trains deliver continuous value to customers in alignment with PI Objectives". SAFe describes it as
    typically an 8 to 12-week timebox, and calls the pattern of PI Planning and iterations a suggestion
    rather than a strict rule. Credited to Scaled Agile, Inc.
  match: ["Planning Interval"]

- id: wsjf
  term: WSJF (weighted shortest job first)
  attribution: adopted
  source: safe-wsjf
  definition: >-
    A prioritisation measure that SAFe estimates as the relative cost of delay divided by the relative
    job duration, from relative user and business value, time criticality, risk reduction and/or
    opportunity enablement, and job size. Credited to the Scaled Agile Framework (Scaled Agile, Inc.),
    whose WSJF page opens with an epigraph attributed to Don Reinertsen, The Principles of Product
    Development Flow. This site credits WSJF to SAFe and does not cite the
    book.
  match: ["WSJF"]

- id: reference-model
  term: Reference model
  attribution: adopted
  source: oasis-soa-rm
  definition: >-
    "An abstract framework for understanding significant relationships among the entities of some
    environment", in the words of the OASIS Reference Model for Service Oriented Architecture, where the
    term is defined for service-oriented environments. This site borrows the sense, not the subject: its
    SAFe reference model is a mapping that shows which item of Core SAFe lines up with which page of
    this site, and why. It is the site's recommended practice, not SAFe guidance and not a description
    of any organisation.
  match: ["reference model"]

- id: pi-planning
  term: PI Planning
  attribution: adopted
  source: safe-pi-planning
  definition: >-
    SAFe's cadence-based event for the entire ART that aligns teams and stakeholders to a shared mission
    and vision. Its outputs are committed PI objectives from the Agile Teams and an ART planning board
    that reflects feature delivery dates and dependencies. SAFe describes it as typically a two-day
    event. Credited to the Scaled Agile Framework (Scaled Agile, Inc.).
  match: ["PI Planning"]

- id: inspect-and-adapt
  term: Inspect and Adapt
  attribution: adopted
  source: safe-inspect-and-adapt
  definition: >-
    SAFe's name for a significant event held at the end of each PI. It is structured into three parts:
    the PI System Demo, a quantitative and qualitative measurement review, and a retrospective and
    problem-solving workshop. Its improvement backlog items go into the ART backlog for consideration in
    the next PI Planning event. Credited to the Scaled Agile Framework (Scaled Agile, Inc.). The site's
    own Inspect and Adapt page uses the name for its checkpoint where evidence is reviewed and a
    workflow is added or tightened; the earlier use of the phrase outside SAFe is not claimed here.
  match: ["Inspect and Adapt", "Inspect & Adapt"]

- id: system-demo
  term: System Demo
  attribution: adopted
  source: safe-system-demo
  definition: >-
    SAFe's event that provides stakeholders an integrated view of new features for the most recent
    iteration delivered by all the teams on the ART. Credited to the Scaled Agile Framework (Scaled
    Agile, Inc.). On this site it lines up loosely with the release readiness decision, which also
    brings the results of several changes together.
  match: ["System Demo"]

- id: continuous-delivery-pipeline
  term: Continuous Delivery Pipeline
  attribution: adopted
  source: safe-cdp
  also: [fowler-deployment-pipeline]
  definition: >-
    SAFe's name for the workflows, activities, and automation needed to guide new functionality from
    ideation to an on-demand release of value. It has four aspects, in order: continuous exploration,
    continuous integration, continuous deployment and release on demand. Credited to the Scaled Agile
    Framework (Scaled Agile, Inc.). Not to be confused with a deployment pipeline as Fowler describes
    it, a build broken into stages.
  match: ["Continuous Delivery Pipeline"]

- id: invest
  term: INVEST
  attribution: adopted
  source: wake-invest
  also: [agile-alliance-dor]
  definition: >-
    Bill Wake's acronym, published in 2003, for the qualities of a good user story: Independent,
    Negotiable, Valuable, Estimable, Small and Testable. The Agile Alliance glossary notes that a team's
    Definition of Ready is generally based on it. This site uses it as one public test of whether an
    item is ready, not as the contents of any team's definition.
  match: ["INVEST"]

- id: acceptance-criteria
  term: Acceptance criteria
  attribution: adopted
  source: istqb-acceptance-criteria
  definition: >-
    In the ISTQB glossary's current wording, the criteria that a work product must satisfy to be
    accepted by the stakeholders. On this site they are written during Specification, carry identifiers
    so that later tasks and tests can point back to them, and form part of the independent basis for
    verification.

- id: testability
  term: Testability
  attribution: adopted
  source: istqb-testability
  definition: >-
    In the ISTQB glossary, the degree to which test conditions can be established for a component or
    system, and tests can be performed to determine whether those test conditions have been met. An
    acceptance criterion with no test condition to establish cannot settle whether the work is accepted.

- id: given-when-then
  term: Given, when, then
  attribution: adopted
  source: fowler-given-when-then
  definition: >-
    A form for writing a requirement as a concrete example: a starting state, an action, and the
    expected outcome. Developed by Daniel Terhorst-North and Chris Matts as part of Behavior-Driven
    Development, as described by Martin Fowler.
  match: ["given, when, then"]

- id: spec-commitment
  term: Spec-first, spec-anchored, spec-as-source
  attribution: adopted
  source: bockeler-sdd
  definition: >-
    Birgitta Böckeler's three degrees of commitment to a specification in spec-driven development.
    Spec-first: a specification is written before the code and used for the task at hand. Spec-anchored:
    the specification is kept after the task and used as the feature evolves. Spec-as-source: the
    specification is the main artefact a person edits, and the code follows from it.
  match: ["spec-anchored", "spec-as-source"]

- id: test-pyramid
  term: Test pyramid
  attribution: adopted
  source: fowler-test-pyramid
  definition: >-
    The advice to have many more low-level unit tests than high-level broad-stack tests running through
    a user interface, drawn as a pyramid. Martin Fowler's bliki entry credits Mike Cohn's 2009 book
    Succeeding with Agile with spreading the name. On this site it is one of the traditional QA
    practices that still shapes what an agent's tests should look like.
  match: ["test pyramid"]

- id: hermetic-build
  term: Hermetic build
  attribution: adopted
  source: sre-book-release-engineering
  definition: >-
    A build that depends only on known versions of build tools and dependencies, so that the same
    revision built on different machines gives identical results, as the release engineering chapter of
    Google's site reliability engineering book describes. With coding agents, the build stays hermetic
    and an agent proposes changes to its configuration rather than taking part in it.
  match: ["hermetic build", "hermetic builds"]

- id: deploy-versus-release
  term: Deploy versus release
  attribution: common
  also: [safe-continuous-deployment, tw-radar-decoupling, fowler-feature-toggles]
  definition: >-
    Deployment is the act of putting a revision into an environment; release is exposing its behaviour
    to users. The two coincide unless a toggle, a canary or a staged rollout separates them. Several
    public sources keep the words apart: SAFe says it is optimal to separate the deployment process from
    releasing; the Thoughtworks Technology Radar placed "Decoupling deployment from release" in Adopt
    (November 2015 and April 2016); and Pete Hodgson's article on feature toggles (9 October 2017) calls
    separating feature release from code deployment "the Continuous Delivery principle". No originator
    is credited here. On this site, a deployment's health is decided in the Deploy phase and exposure to
    users in Release.
  match: ["deploy versus release", "deployment versus release"]

- id: release-toggle
  term: Release toggle
  attribution: adopted
  source: fowler-feature-toggles
  definition: >-
    One of the four kinds of feature toggle Pete Hodgson distinguishes by lifespan (release, experiment,
    ops and permissioning). A release toggle lets incomplete or untested code paths ship to production
    as latent code that may never be turned on, so exposure to users can be decided apart from
    deployment. It is meant to be short-lived: Hodgson treats toggles as inventory with a carrying cost
    and says release toggles should generally not stay much longer than a week or two.
  match: ["release toggle", "release toggles"]

- id: dark-launching
  term: Dark launching
  attribution: adopted
  source: fowler-dark-launching
  definition: >-
    Martin Fowler's description: taking a new or changed back-end behaviour and calling it from existing
    users without their being able to tell it is being called, to assess load and performance before the
    capability is announced. Fowler notes that the term has been subject to semantic diffusion, so other
    sources may use it more loosely.
  match: ["dark launching", "dark launch"]

- id: definition-of-ready
  term: Definition of Ready
  attribution: common
  also: [agile-alliance-dor]
  definition: >-
    The criteria a team makes explicit and visible that an item must meet before the team accepts it for
    work; the Agile Alliance glossary describes them for a user story and as generally based on the
    INVEST matrix. The Scrum Guide does not use the term; it says Product Backlog items that can be Done
    within one Sprint are deemed ready for selection in Sprint Planning.
  match: ["Definition of Ready"]

- id: definition-of-done
  term: Definition of Done
  attribution: adopted
  source: scrum-guide-2020
  also: [safe-glossary]
  definition: >-
    A formal description of the state of the Increment when it meets the quality measures required for
    the product (Ken Schwaber and Jeff Sutherland, The 2020 Scrum Guide). It is the Increment's
    commitment, and a Product Backlog item that does not meet it cannot be released or even presented at
    the Sprint Review. SAFe's glossary words it as the requirements for completeness of a work product
    or increment of value. This site applies it at story, increment and release, and treats the release
    level as recommended practice.
  match: ["Definition of Done"]

- id: traceability-spine
  term: Traceability spine
  attribution: coined
  definition: >-
    The map's name for the chain of seven kinds of artefact (requirement, spec, task, test, change,
    release, incident), each linked to the next by an identifier. Rule IDs tie checks and findings to
    the chain, and decisions are tied to it through the checks and findings they read. The name, and
    the extension of the chain to the incident, are this site's, built on requirements traceability as
    Gotel and Finkelstein (1994) describe it: the ability to describe and follow the life of a
    requirement forwards and backwards.
  match: ["traceability spine"]

- id: pre-integration-review
  term: Pre-integration review
  attribution: adopted
  source: fowler-branching-patterns
  definition: >-
    Martin Fowler's name for the branching pattern in which every commit to the mainline is
    peer-reviewed before the mainline accepts it; he describes the pull request as a mechanism that
    combines feature branching with this kind of review. On this site it is the practice the
    pull-request verification workflow puts into a recorded decision for one revision.
  match: ["pre-integration review"]

- id: canary-release
  term: Canary release (canarying)
  attribution: adopted
  source: fowler-canary-release
  also: [sre-workbook-canarying]
  definition: >-
    Danilo Sato's description on martinfowler.com: rolling out a change slowly to a small subset of users
    before the entire infrastructure, with rollback by rerouting users back to the old version. Google's
    Site Reliability Workbook defines canarying as a partial and time-limited deployment of a change in a
    service and its evaluation, in which the part that receives the change, the canary, is judged against
    the remainder, the control, and absolute measures such as service level objectives are used as well.
  match: ["canary release", "canarying"]

- id: service-level-objective
  term: Service level objective (SLO)
  attribution: adopted
  source: deployverif-sre-book-slo
  definition: >-
    From Google's Site Reliability Engineering book: a target value or range of values for a service level
    that is measured by a service level indicator (SLI), where an SLI is a carefully defined quantitative
    measure of some aspect of the level of service provided. The book calls SLIs and SLOs crucial elements
    in the control loops used to manage systems.
  match: ["service level objective", "service level objectives"]

- id: postmortem
  term: Postmortem
  attribution: adopted
  source: incident-sre-book-postmortem
  also: [google-sre-postmortem]
  definition: >-
    A written record of an incident, its impact, the actions taken to mitigate or resolve it, its root
    causes and the follow-up actions to prevent it recurring, in the definition of Google's site
    reliability engineering (SRE) book. The SRE book and workbook describe it as blameless: it looks
    for contributing causes in the system without blaming any person or team.
  match: ["postmortem", "postmortems"]

- id: regression-testing
  term: Regression testing
  attribution: adopted
  source: incident-istqb-regression-testing
  also: [incident-istqb-confirmation-testing, istqb-ctfl-4]
  definition: >-
    In the ISTQB glossary, a type of change-related testing that detects whether defects have been
    introduced or uncovered in unchanged areas of the software. The same glossary separates it from
    confirmation testing, which follows the fix of a defect and confirms that the failure it caused
    does not reoccur.
  match: ["regression testing"]

# Assurance (1.7.0): entries arrive with the pages that use them (D-025).

- id: delivery-template
  term: Delivery template
  attribution: coined
  definition: >-
    A working name, used on this site, for the fixed and versioned outline of one kind of delivery
    document (specification, plan, architecture decision record or release notes). It names the parts
    a writer fills and marks which are required, so a tool can confirm their presence and form and an
    agent can draft into it for a person to finish. Templates are kit-owned files and change only in a
    kit release.
  match: ["delivery template", "delivery templates"]

- id: change-control
  term: Change control (configuration change control)
  attribution: adopted
  source: nist-800-128
  also: [nist-glossary-configuration-control]
  definition: >-
    NIST's term for the documented process by which proposed changes to a system are put forward,
    justified, made, tested, reviewed and then accepted or turned down. NIST's related term,
    configuration control, is the process that protects a system against improper modifications
    before, during and after it goes into service.
  # "change control" alone is left out of match: release, release-readiness and the catalog use it
  # for row W32 without citing nist-800-128, and check_citations would then require that source there.
  match: ["configuration change control"]

- id: separation-of-duties
  term: Separation of duties
  attribution: adopted
  source: nist-800-53
  also: [nist-glossary-separation-of-duty]
  definition: >-
    The security principle that no one holds enough privilege to misuse a system alone, so that
    misuse takes more than one party. NIST SP 800-53 sets it out as control AC-5. On this site it
    means that whoever produces a change, whether a person or an agent's run, is never the one who
    approves it.
  # source is nist-800-53 because every published page that uses the phrase (workflows,
  # pull-request-verification, agent-permissions) already cites it; "segregation of duties" is left
  # out of match because release, release-readiness and pull-request-verification use it with DORA only.
  match: ["separation of duties"]

- id: trust-services-criteria
  term: Trust Services Criteria
  attribution: adopted
  source: aicpa-soc2
  definition: >-
    The criteria set by the AICPA's Assurance Services Executive Committee that the map names for
    SOC 2. This site names the framework and its originator and does not restate the content of
    any criterion.
  match: ["Trust Services Criteria"]

- id: ai-use-policy
  term: AI use policy
  attribution: common
  also: [nist-ai-rmf, nist-ai-600-1]
  definition: >-
    An organisation's stated position on how AI systems may take part in delivery work: which data
    may be given to which models and on what terms, and what generated code must pass, and how it is
    disclosed, before it is accepted. On this site each point of such a policy is held as a rule with
    an owner, enforced by checks, a named decider or both. NIST's generative AI profile uses the
    related phrase "acceptable use policies". The term carries no legal content here.
  match: ["AI use policy", "AI use policies"]

- id: least-privilege
  term: Least privilege
  attribution: adopted
  source: nist-glossary-least-privilege
  also: [nist-800-53, nist-ssdf]
  definition: >-
    The security principle that a user, or a process acting on behalf of a user, holds only the
    access its assigned task needs. NIST's glossary records definitions from several of its
    publications, and NIST SP 800-53 applies the principle through control AC-6. On this site it is
    what bounds an agent's identity, independent of the agent's instructions.
  match: ["least privilege"]

- id: excessive-agency
  term: Excessive agency
  attribution: adopted
  source: owasp-llm06-2025
  definition: >-
    OWASP's name, in its Top 10 for LLM Applications 2025 (LLM06), for the vulnerability that lets
    damaging actions be performed in response to unexpected, ambiguous or manipulated model output.
    OWASP traces it to excessive functionality, excessive permissions or excessive autonomy, and its
    mitigations include narrowing the tools and permissions an agent holds and enforcing
    authorisation in downstream systems rather than in the model.
  match: ["excessive agency"]
