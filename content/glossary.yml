# Terminology and where it comes from.
#
# attribution:
#   adopted  — the term and its meaning come from `source`; cite it where used
#   adapted  — the idea comes from `source`; this site uses a different word or a narrower meaning
#   coined   — a working name introduced by this site
#   common   — ordinary engineering vocabulary, no single source
#
# `match` lists phrases the generator auto-links (first occurrence per chapter).
# `counterpart` names the nearest term in Böckeler's harness-engineering vocabulary,
# so readers moving between the two can translate.

- id: ai-sdlc
  term: AI SDLC
  attribution: common
  also: [ibm-ai-lifecycle, ibm-ai-dlc, aws-ai-dlc]
  definition: >-
    The software development lifecycle (SDLC) with AI agents doing part of the work in every phase,
    from intent and specification through design, build, verification, release and operation, while
    deterministic checks and human decisions stay where they are needed. Not to be confused with two
    nearby uses. First, the lifecycle for building AI and machine-learning systems themselves: data
    preparation, model training and evaluation, deployment and monitoring for drift, which IBM calls the
    AI lifecycle. Second, the AI-Driven Development Lifecycle (AI-DLC), one vendor's named methodology:
    AWS structures it as Inception, Construction and Operations phases in which AI proposes a plan and
    asks clarifying questions, and people approve. This site uses the plain term for the lifecycle and
    does not follow any one methodology. The term is written without a hyphen.
  match: ["AI SDLC"]

- id: harness
  term: Harness
  attribution: adopted
  source: bockeler-harness
  also: [bockeler-context]
  definition: >-
    Everything in a coding agent except the model itself: the context it reads, the tools it can
    call, the permissions that bound it, the checks that run on its output and the record of what it did.
    Böckeler's formulation is "Agent = Model + Harness". This site uses the wide sense — the whole
    engineering environment around the agent — rather than the narrow sense of the scaffolding around one model call.
  match: ["agent harness", "the harness"]

- id: harness-engineering
  term: Harness engineering
  attribution: adopted
  source: bockeler-harness
  also: [openai-harness]
  definition: >-
    The practice of deliberately designing and maintaining the harness: what the agent can discover,
    what it can do, how its work is checked and when a person needs to decide. Böckeler frames it as
    building trust in coding agents through systematic controls; one model vendor's account describes the same
    work applied to one large codebase. Here it is the discipline, distinct from the artefact
    (Engineering Kit), the unit (workflow) and the operating state (software factory).
  match: ["harness engineering"]

- id: guides-and-sensors
  term: Guides and sensors
  attribution: adopted
  source: bockeler-harness
  definition: >-
    Böckeler's two kinds of control. Guides are feedforward: they anticipate the agent's behaviour and
    steer it before it acts (instructions, constitutions, skills, templates). Sensors are feedback: they
    observe after the agent acts and help it self-correct (tests, linters, type checkers, AI review).
    The site's own vocabulary uses other words, but the split runs through it: skills and constitutions are guides;
    validators, tests and the review skill are sensors.
  counterpart: "guides ↔ skills, constitution, readiness questions; sensors ↔ validators, tests, review skill"

- id: two-kinds-of-machinery
  term: Two kinds of machinery (probabilistic and deterministic)
  attribution: adapted
  source: bockeler-harness
  definition: >-
    Probabilistic machinery understands intent, explores code, proposes designs and summarises evidence;
    deterministic machinery compiles, runs tests, enforces dependency rules and blocks invalid builds.
    Böckeler draws the same line as computational controls (deterministic, fast, run by the CPU) versus
    inferential controls (semantic analysis, AI review, LLM-as-judge). The rule here is that final
    enforcement belongs with the deterministic side wherever a machine can check reliably.
  counterpart: "computational ↔ deterministic; inferential ↔ probabilistic"
  match: ["deterministic machinery", "probabilistic machinery", "two kinds of machinery"]

- id: steering-loop
  term: Steering loop
  attribution: adopted
  source: bockeler-harness
  definition: >-
    Böckeler's name for the human practice of iteratively improving guides and sensors based on recurring
    agent failures. This site calls the same thing the feedback path, and enumerates its conversions:
    defect → test, recurring comment → rule, violated rule → gate, production failure → eval case.
  counterpart: "steering loop ↔ feedback path"

- id: feedback-path
  term: Feedback path
  attribution: adapted
  source: bockeler-harness
  definition: >-
    The defined place each lesson goes. A defect becomes a regression test. A recurring review comment
    becomes a rule. A rule that keeps being violated becomes a deterministic gate. A production failure
    becomes an evaluation case. A misunderstood requirement becomes a readiness question. A repeated
    procedure becomes a skill. A brittle agent behaviour becomes a change to the harness. The change lands
    upstream of where the problem appeared.
  match: ["feedback path", "one feedback path"]

- id: harnessability
  term: Harnessability
  attribution: adopted
  source: bockeler-harness
  definition: >-
    The degree to which a codebase supports building a harness: typed languages, well-defined boundaries
    and a runnable local environment make sensors cheap to add. A runnable starting point for the
    agent and brownfield pre-flight analysis (workflow catalog) are the same concern.

- id: harness-template
  term: Harness template
  attribution: adopted
  source: bockeler-harness
  definition: >-
    Böckeler's proposal for bundles of guides and sensors standardised for common service topologies.
    The Engineering Kit's technology profiles (validators and guidance per supported stack) are one
    concrete form of this idea, with a rule registry and evidence schema added underneath.
  counterpart: "harness template ↔ Engineering Kit technology profile"

- id: technology-profile
  term: Technology profile
  attribution: coined
  definition: >-
    The Engineering Kit layer that packages what one supported stack needs: its validators, pinned tool
    versions, skills, scaffolds and default thresholds. It adds rules and checks for its stack; it does
    not change what the shared core's rules mean and carries no one project's choices. One concrete form
    of what Böckeler proposes as a harness template.
  counterpart: "technology profile ↔ harness template"
  match: ["technology profile", "technology profiles"]

- id: project-configuration
  term: Project configuration
  attribution: coined
  definition: >-
    The Engineering Kit layer where one project supplies meaning, as a committed, reviewed file: which
    rules apply and which checks run for each kind of change, thresholds within the bounds the core or
    profile allows, exceptions with an owner and expiry, and the chosen profile and adapters. It cannot
    change the evidence schema, redefine a result state or waive a rule the core marks as never open to
    exception.
  match: ["project configuration"]

- id: golden-path
  term: Golden path
  attribution: adopted
  source: spotify-golden-paths
  also: [cncf-platforms, dora-platform-engineering]
  definition: >-
    The opinionated, supported way to build a kind of system that a platform offers its users, with
    templates and documentation, so that each team does not assemble its own tooling. Associated with
    Spotify's engineering writing and used in the CNCF platforms white paper and by DORA. An Engineering
    Kit's technology profiles play a similar part for the harness around a coding agent.
  match: ["golden path", "golden paths"]

- id: engineering-kit
  term: Engineering Kit
  attribution: coined
  definition: >-
    A working name, used on this site, for a versioned, installable package of the engineering environment
    a team wants its people and its coding agents to operate inside: rule registry, validators, skills with
    evaluation scenarios, evidence schema and thin tool adapters, organised in four layers (shared core,
    technology profiles, tool adapters, project configuration) and run through three commands: init
    (install), doctor (check prerequisites) and verify (run the declared checks and write the evidence
    record, the same way locally and in CI). Not an industry term.
  match: ["Engineering Kit"]

- id: rule-registry
  term: Rule registry
  attribution: coined
  definition: >-
    One entry per rule the team cares about, with an identifier, a statement, a route (gate, judgment or
    guidance), an owner and known gaps. Validators declare which rules they enforce, skills which rules
    they support, evidence which rule checks ran. The connecting structure of the kit.
  match: ["rule registry"]

- id: architecture-decision-record
  term: Architecture decision record
  attribution: adopted
  source: nygard-adr
  also: [tw-radar-adr]
  definition: >-
    Michael Nygard's short record of one architecturally significant decision: its title, context,
    the decision, its status and its consequences. Records are numbered in sequence, numbers are
    not reused, and a reversed decision is kept and marked superseded rather than edited. This site
    uses the same pattern for the history of each rule in the rule registry.
  match: ["architecture decision record", "architecture decision records"]

- id: rule-route
  term: Rule route (gate / judgment / guidance)
  attribution: coined
  definition: >-
    The decision, made once per rule, of how it is enforced. A gate is a deterministic check that can
    block. A judgment is a named person's call, recorded. Guidance shapes what the agent tries to do but
    enforces nothing. "An instruction asks; a gate refuses." Böckeler's regulation categories
    (maintainability, architecture fitness, behaviour) classify what a control regulates; the route
    classifies how strongly.
  match: ["routed to a gate", "routed to judgment", "gate, judgment or guidance"]

- id: gate
  term: Gate (deterministic gate)
  attribution: common
  also: [fowler-ci, fitness-function, ford-evolutionary-architectures]
  definition: >-
    A check that runs on the output and can stop it: the kit's verify command before a push, required checks
    on a pull request, policy rules at release. Different from an instruction because it refuses rather
    than asks. Architecture gates are what evolutionary-architecture practice calls fitness functions.
  match: ["deterministic gate", "deterministic gates"]

- id: fitness-function
  term: Fitness function (architectural)
  attribution: adopted
  source: ford-evolutionary-architectures
  also: [thoughtworks-radar-fitness, fitness-function]
  definition: >-
    From evolutionary-architecture practice (Ford, Parsons and Kua, Building Evolutionary
    Architectures), which borrows the idea from evolutionary computing: an objective assessment of
    how well a system preserves an architectural characteristic, carried out through tests, metrics,
    monitoring and similar mechanisms. On this site, an architecture rule expressed as a fitness
    function that runs with the build is a validator, and an architecture gate once it blocks.
  match: ["fitness function", "fitness functions", "architectural fitness function"]

- id: deterministic-gate
  term: Deterministic floor
  attribution: coined
  definition: >-
    The minimum a kit's first release needs before any skill: a verify command that runs the same way
    locally and in CI, a few validators for rules the team has broken before, a rule
    registry and an evidence schema. Dull, and the only part that makes the rest safe.
  match: ["deterministic floor"]

- id: validator
  term: Validator
  attribution: adapted
  source: bockeler-sensors
  definition: >-
    A deterministic check tied to a rule identifier. Runs the same way locally and in CI, returns
    passed / failed / skipped / could_not_run, and can block a merge. Ships when it runs reliably and
    its failures are actionable. Böckeler's computational sensors (linters, type checks, dependency
    rules, SAST, mutation testing) are validators.
  counterpart: "validator ↔ computational sensor"
  match: ["validators", "validator"]

- id: skill
  term: Skill
  attribution: common
  also: [bockeler-context, anthropic-agent-skills, github-agent-skills]
  definition: >-
    Guidance the agent loads on demand, tied to rule identifiers, that shapes what it tries to do without
    guaranteeing it. Probabilistic. Ships only with an evaluation history. In Böckeler's terms, a guide.
  counterpart: "skill ↔ guide (feedforward control)"
  match: ["reusable skill", "skill manifest"]

- id: review-skill
  term: Review skill
  attribution: adapted
  source: bockeler-sensors
  definition: >-
    An agent that reads a diff against the applicable rules and produces findings tagged to rule
    identifiers. It proposes; it cannot block. Böckeler's inferential sensors (AI security review,
    modularity review) are the same kind of thing.
  counterpart: "review skill ↔ inferential sensor"
  match: ["review skill", "reviewing agent"]

- id: harness-evaluation
  term: Harness evaluation (eval)
  attribution: common
  also: [anthropic-agent-evals]
  definition: >-
    A scenario that tests whether the agent and its environment behave as intended: given a spec with an
    unresolved access rule, does the agent stop and ask? Distinct from application tests. Repeated when
    prompts, skills, tools or models change. This site treats eval history as the bar for shipping a skill.
  match: ["harness evaluations", "evaluation case", "eval suite"]

- id: llm-as-a-judge
  term: LLM-as-a-judge
  attribution: adopted
  source: zheng-llm-judge
  definition: >-
    Using a language model to grade the output of another model or agent, as studied by Zheng et al.
    (2023). Flexible and scalable, but itself non-deterministic and subject to position, verbosity and
    self-enhancement biases, so its grades are checked against human judgement before they are relied on.
    In an eval set it is one kind of grader, alongside code-based checks and human review.
  match: ["LLM-as-a-judge"]

- id: evidence-record
  term: Evidence record
  attribution: coined
  definition: >-
    What a run records in one fixed shape, as a by-product of the run rather than a report written
    afterwards: schema version, change and configuration revisions, kit version, the checks expected
    before the run, each check's result with its rule ID, status and report link, agent findings,
    decisions pending and taken, and an overall status derived from the rest. Each field has one kind
    of writer (the kit, a validator, an agent or a named person). Its schema is fixed by the kit and
    is the one thing a project cannot customise.
  match: ["evidence record", "evidence schema"]

- id: could-not-run
  term: could_not_run
  attribution: coined
  also: [sarif-2-1-0, python-unittest]
  definition: >-
    A first-class result state, distinct from failed and skipped: the check was required but its
    prerequisite was missing (a tool absent from the runner image, an environment unavailable), it timed
    out again after one retry, or the tool itself crashed. It is never reported as passed or skipped;
    what it means for a merge or release is decided in assurance. Without it, the first broken runner
    quietly turns every gate it hosts into a suggestion.
    The name is this site's; the distinction is established, for example in SARIF's record of whether a
    tool's execution succeeded, and in test frameworks that report errors apart from failures.
  match: ["could_not_run", "could not run"]

- id: adapter
  term: Adapter
  attribution: adapted
  source: cockburn-hexagonal
  definition: >-
    The thin binding between the kit's core and one tool: an execution surface (where the agent runs),
    a change host (where the pull request lives), a pipeline runner (where checks run unattended), a
    work tracker, or a tool server the agent calls. It translates; it holds no rules, validator logic or
    schema. The test of an adapter is how little is in it. Adapted from Alistair Cockburn's ports and
    adapters pattern (see that entry): his adapters sit at an application's ports, and this site
    applies the idea to the one layer of a kit that talks to outside tools.
  match: ["tool adapters", "thin adapters"]

- id: ports-and-adapters
  term: Ports and adapters
  attribution: adopted
  source: cockburn-hexagonal
  definition: >-
    Alistair Cockburn's architecture pattern, also called hexagonal architecture: an application
    talks to the outside world only through ports, and a technology-specific adapter at each port
    translates between the outside device and the application, so the application can be driven
    by people, programs or tests and developed apart from the devices and databases it runs
    against. The Engineering Kit's tool adapters apply the same idea to the tools a kit runs against.
  match: ["ports and adapters", "hexagonal architecture"]

- id: anticorruption-layer
  term: Anticorruption layer
  attribution: adopted
  source: evans-ddd-reference
  definition: >-
    Eric Evans's domain-driven design pattern: an isolating layer that talks to another system
    through its existing interface and translates between the two models, so the other system's
    concepts do not reshape the model that uses it. A kit's adapters play this part between the
    kit's core and a tool's own vocabulary.
  match: ["anticorruption layer", "anti-corruption layer"]

- id: contract-test
  term: Contract test
  attribution: adopted
  source: fowler-contract-test
  definition: >-
    Martin Fowler's name for a test that checks a test double still behaves like the real
    outside service it stands in for. It runs apart from the main build, at the pace the outside
    service changes. On this site, the contract suite a kit's core defines for each kind of
    adapter is the same idea pointed at the kit's own interface.
  match: ["contract test", "contract tests"]

- id: consumer-driven-contract
  term: Consumer-driven contract
  attribution: adopted
  source: robinson-cdc
  definition: >-
    Ian Robinson's service-evolution pattern: the consumers of a service state their
    expectations as tests, and the provider is checked against all of them, so it can change
    without breaking any consumer.
  match: ["consumer-driven contract", "consumer-driven contracts"]

- id: mechanism-vs-meaning
  term: Mechanism versus meaning
  attribution: coined
  definition: >-
    The kit supplies reusable mechanism (a test pattern, a runner, a rule identifier); the project supplies
    the meaning those mechanisms must preserve (which identities may export which records, which fields are
    excluded). A kit cannot infer product decisions because it has an authorization skill.
  match: ["mechanism", "project intent"]

- id: workflow
  term: Workflow
  attribution: coined
  definition: >-
    One delivery decision run end to end: a trigger, inputs, an agent task, automated checks, guardrails,
    a human decision, outputs, feedback and an owner. A team has one when every qualifying change goes
    through it and leaves a record that the next decision reads.
  match: ["a workflow"]

- id: three-roles
  term: Three roles (agent, checks, people)
  attribution: coined
  definition: >-
    The agent does what is expensive for a person and tolerable to get slightly wrong. The checks do what
    must not be wrong. The people do what needs context the workflow cannot hold. Workflows fail when these
    blur: an agent treated as verifier, or people treated as checks.

- id: risk-tier
  term: Risk tier
  attribution: common
  also: [istqb-rbt, iso-29119-1]
  definition: >-
    Assigned at readiness or planning; selects which checks and which reviewers apply. The workflow
    definition stays the same, its cost scales with the change. A low tier never removes an applicable rule.
    The idea of scaling test effort to risk comes from risk-based testing.
  match: ["risk tier", "tier 2"]

- id: failure-path
  term: Failure path
  attribution: coined
  definition: >-
    A defined response to an interruption: a check detects a violation, a required check cannot run, a
    requirement is ambiguous, an agent finding is rejected, an exception is requested. A test failure and an
    unavailable environment need different responses; treating either as a pass misrepresents the evidence.
  match: ["failure paths"]

- id: evidence-handoff
  term: Evidence hand-off
  attribution: coined
  definition: >-
    Workflows are built one at a time but read each other's records: the readiness record configures
    verification, the verification record feeds release readiness, the release record is what an incident
    review reads. Evidence carries its scope with it and expires when the revision changes.
  match: ["hand each other evidence"]

- id: software-factory
  term: Software factory
  attribution: coined
  also: [cusumano-software-factories, greenfield-software-factories, shapiro-five-levels, willison-software-factory]
  definition: >-
    Not a product or a platform: the operating state that appears when enough workflows share rules,
    evidence and feedback, so that what production teaches changes what specification asks. Coined in
    this sense. Earlier uses of the phrase mean something else: Cusumano (1991) for Japanese firms that
    applied production-management discipline to large-scale software development, and Greenfield and
    Short (2004) for model-driven production of variants of a standard product. Recent writing on the
    "dark software factory", where agents produce software that no person reviews, is not what is meant
    either, nor is the industrial sense of identical outputs from a fixed process.
  match: ["software factory"]

- id: review-fatigue
  term: Review fatigue
  attribution: common
  definition: >-
    More workflows, more evidence and more agent output landing on the same few approvers. Leading
    indicators: review latency, reviewer concentration, shortening comments. The answer is moving every
    mechanical check into a gate so reviewers see only decisions and exceptions.
  match: ["review fatigue"]

- id: skill-erosion
  term: Skill erosion
  attribution: common
  definition: >-
    What happens when agents do all the implementation and all the first drafts: the team stops getting
    the unaided repetitions that keep judgment sharp, and the factory depends on that judgment at every
    human decision point.
  match: ["skill erosion"]

- id: spec-driven-development
  term: Spec-driven development
  attribution: adopted
  source: spec-kit
  definition: >-
    Making expected behaviour and constraints explicit before implementation, in a sequence from intent
    through specification, plan and tasks, with clarification added where the specification leaves
    questions open. This site treats it as the process spine the harness wraps around, and stays neutral
    on which tool supplies it.
  match: ["Spec-Driven Development", "spec-driven development", "spec-driven flow"]

- id: specification-readiness
  term: Specification readiness
  attribution: coined
  definition: >-
    Enough clarity to proceed responsibly, with remaining uncertainty made visible. A workflow whose
    trigger is a spec marked ready for planning, whose checks are structural, whose decision is the product
    owner's, and whose output is a readiness record later workflows read.
  match: ["specification readiness", "readiness record"]

- id: independent-basis
  term: Independent basis for verification
  attribution: coined
  definition: >-
    If an agent generates both the implementation and its tests from the same incomplete understanding,
    both may share the same mistaken assumption. Verification needs something defined apart from the
    implementation: acceptance criteria, access rules, interface contracts, representative data, failure scenarios.
  match: ["independent basis"]

- id: export-example
  term: The export example
  attribution: coined
  definition: >-
    The running hypothetical: a feature that lets users export customer records. Open decisions (which
    records, which fields, large exports, failure, audit), an access rule (R-042 / SEC-004), a background
    worker with a broader query, a 50k-row load scenario, a volume-limit rule (R-017). It is the site's one
    worked example: a page that needs an example follows this change, so the abstractions can be checked
    against one story.
  match: ["customer-record export", "export feature"]

- id: requisite-variety
  term: Requisite variety
  attribution: adopted
  source: ashby
  also: [bockeler-harness]
  definition: >-
    Ashby's law: a regulator can only control a system if it has at least as much variety as the system
    it governs. Böckeler uses it to explain why committing to a narrow topology makes an agent easier to
    harness: restricting what the agent may produce shrinks the space the controls must cover. The law
    does not say fewer controls are better. This site's recommendation follows from shrinking what is
    governed: narrow what the agent may produce first, on a few well-defined execution surfaces, then
    start with a small set of controls fitted to failures actually seen.
