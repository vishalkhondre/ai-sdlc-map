  date: "SLSA v1.2, status Approved (no release date printed)"
  url: "https://slsa.dev/spec/v1.2/build-track-basics"
  accessed: "2026-11-20"
  note: "Tab title 'SLSA - Build: Track Basics'. Table of levels: Build L1 provenance showing how the package was built; L2 signed provenance, generated by a hosted build platform; L3 hardened build platform."

istqb-ctfl-4:
  title: "Certified Tester Foundation Level Syllabus v4.0.1"
  author: "International Software Testing Qualifications Board (ISTQB)"
  org: "ISTQB"
  date: "2024-09-15 (v4.0.1, errata release of v4.0 of 2023-04-21)"
  url: "https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf"
  accessed: "2026-11-20"
  note: "Section 2.2.1 describes five test levels: component (unit), component integration, system, system integration and acceptance; section 2.2.3 says confirmation testing confirms that an original defect has been successfully fixed and regression testing confirms that no adverse consequences have been caused by a change. The certification overview page is https://istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/ ('Certified Tester Foundation Level (CTFL) v4.0'); the claims rest on the syllabus, not on the overview page."

fowler-test-pyramid:
  title: "Test Pyramid"
  author: "Martin Fowler"
  org: "martinfowler.com (bliki)"
  date: "2012-05-01"
  url: "https://martinfowler.com/bliki/TestPyramid.html"
  accessed: "2026-11-20"
  note: "Says to have many more low-level unit tests than high-level broad-stack tests running through a GUI. Credits Mike Cohn's 2009 book Succeeding with Agile for the name's spread, and says Fowler drew it with Lisa Crispin in 2003-4."

nist-ir-8397:
  title: "Guidelines on Minimum Standards for Developer Verification of Software"
  author: "Paul E. Black, Barbara Guttman, Vadim Okun"
  org: "National Institute of Standards and Technology (NIST)"
  date: "2021-10"
  url: "https://csrc.nist.gov/pubs/ir/8397/final"
  accessed: "2026-11-20"
  note: "NISTIR 8397 (DOI https://doi.org/10.6028/NIST.IR.8397); response to Executive Order 14028 of 12 May 2021. Recommends eleven techniques, in this order: threat modeling; automated testing; static code scanning; heuristic tools for hardcoded secrets; built-in checks and protections; black box test cases; code-based structural test cases; historical test cases; fuzzing; web application scanners; addressing included code. States that it does not address the totality of software verification but recommends techniques that are broadly applicable and form the minimum standards. The CSRC page prints 'Paul Black'; the PDF prints 'Paul E. Black'."

owasp-wstg:
  title: "OWASP Web Security Testing Guide"
  author: "OWASP WSTG project (project leaders listed in the README: Rick Mitchell, Elie Saad)"
  org: "OWASP Foundation"
  date: "last stable release 4.2 per the README; version 5.0 in progress (no date printed in the README)"
  url: "https://github.com/OWASP/wstg"
  accessed: "2026-11-20"
  note: "README text read from raw.githubusercontent.com; the github.com repository page itself was not fetched. Describes the WSTG as a comprehensive guide to testing the security of web applications and web services, created by the collaborative efforts of security professionals and dedicated volunteers; it does not call itself vendor-neutral. Each test scenario has an identifier in the format WSTG-<category>-<number> (example WSTG-INFO-02), and the README prefers a versioned form such as WSTG-v42-INFO-02."

owasp-secrets-management:
  title: "Secrets Management Cheat Sheet"
  author: "not printed (page footer credits 'Cheat Sheets Series Team')"
  org: "OWASP Cheat Sheet Series"
  date: "not printed"
  url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  accessed: "2026-11-20"
  note: "Introduction says organizations need to centralize the storage, provisioning, auditing, rotation and management of secrets. Section 2.3 (Access Control) applies the least privilege principle; section 2.6 (Auditing) lists what to audit at minimum, including who requested a secret and for what system and role, and when a secret was used and by whom or what."

istqb-stress-testing:
  title: "stress testing"
  author: "International Software Testing Qualifications Board (ISTQB)"
  org: "ISTQB Glossary"
  date: "term version 1 (no page date printed)"
  url: "https://glossary.istqb.org/en_US/term/stress-testing"
  accessed: "2026-11-20"
  note: "Text read from the glossary's own API (https://api.glossary.istqb.org/v1/terms/stress-testing). Defines stress testing as a type of performance testing to evaluate a system or component at or beyond the limits of its anticipated or specified workloads, or with reduced availability of resources such as access to memory or servers. The glossary record cites ISO/IEC/IEEE 24765 (2017); the site does not rely on that standard."

dora-2024-highlights:
  title: "Highlights from the 10th DORA report"
  author: "Nathen Harvey; Derek DeBellis"
  org: "Google Cloud Blog"
  date: "2024-10-22"
  url: "https://cloud.google.com/blog/products/devops-sre/announcing-the-2024-dora-report"
  accessed: "2026-11-20"
  note: "Tab title 'Announcing the 2024 DORA report | Google Cloud Blog'. Says AI adoption may negatively impact software delivery performance and refers to small batch sizes and robust testing mechanisms. The page gives numeric estimates; the site quotes none."

konstantinou-test-oracles:
  title: "Can we find bugs using LLM-generated oracles?"
  author: "Michael Konstantinou, Renzo Degiovanni, Mike Papadakis"
  org: "arXiv (cs.SE)"
  date: "v1 submitted 28 Oct 2024; v2 last revised 5 Oct 2026"
  url: "https://arxiv.org/abs/2410.21136"
  accessed: "2026-11-20"
  note: "Preprint; the arXiv page prints no venue. Abstract says LLM-based test generation approaches mainly capture the actual program behavior, making bug detection difficult; the study covers test cases and oracles written by developers and automatically generated for 24 Java repositories (the abstract does not say open-source)."

metr-reward-hacking:
  title: "Recent Frontier Models Are Reward Hacking"
  author: "Sydney Von Arx, Lawrence Chan, Beth Barnes"
  org: "METR"
  date: "2025-06-05"
  url: "https://metr.org/blog/2025-06-05-recent-reward-hacking/"
  accessed: "2026-11-20"
  note: "Research post. Describes reward hacking as attempting to get a higher score by modifying the tests or scoring code, gaining access to an existing implementation or answer, or exploiting other loopholes in the task environment. The examples are on METR's own evaluation tasks; the post also reports a case where a model reward hacked in 14 of 20 attempts when the task was framed as research with real-world consequences. It is not a study of production teams."

anthropic-claude-37-system-card:
  title: "Claude 3.7 Sonnet System Card"
  author: "Anthropic"
  org: "Anthropic"
  date: "not printed on the document"
  url: "https://www.anthropic.com/claude-3-7-sonnet-system-card"
  accessed: "2026-11-20"
  note: "The URL redirects to a 43-page PDF (https://assets.claude.com/9ff93dfa8f445c932415d335c88852ef47f1201e.pdf); no date is printed on the document. Section 6, 'Excessive Focus on Passing Tests': the model occasionally resorts to special-casing in order to pass test cases in agentic coding environments, most often directly returning expected test values but also modifying the problematic tests themselves. Section 6.1 says the behaviour emerged as a result of reward hacking during reinforcement learning training and that partial mitigations were applied before launch."

fowler-canary-release:
  title: "Canary Release"
  author: "Danilo Sato"
  org: "martinfowler.com (bliki)"
  date: "2014-06-25"
  url: "https://martinfowler.com/bliki/CanaryRelease.html"
  accessed: "2026-11-20"
  note: "Slowly rolling out a change to a small subset of users before the entire infrastructure; the rollback strategy is to reroute users back to the old version."

sre-workbook-canarying:
  title: "Canarying Releases"
  author: "Alec Warner and Štěpán Davidovič, with Alex Hidalgo, Betsy Beyer, Kyle Smith, and Matt Duftler"
  org: "Google, The Site Reliability Workbook (O'Reilly Media, 2018), chapter 16; sre.google"
  date: "2018 (chapter footer: Copyright 2018 Google, Inc.)"
  url: "https://sre.google/workbook/canarying-releases/"
  accessed: "2026-11-20"
  note: "Defines canarying as a partial and time-limited deployment of a change in a service and its evaluation; the part of the service that receives the change is 'the canary' and the remainder is 'the control'."

twelve-factor-config:
  title: "III. Config"
  author: "Adam Wiggins"
  org: "The Twelve-Factor App (12factor.net)"
  date: "last updated 2017 (as printed)"
  url: "https://12factor.net/config"
  accessed: "2026-11-20"
  note: "Requires strict separation of config from code; config varies substantially across deploys and code does not; config is stored in the environment. Lists resource handles to backing services, credentials to external services and per-deploy values such as the hostname as config."

tw-radar-decoupling:
  title: "Decoupling deployment from release"
  author: "Thoughtworks"
  org: "Thoughtworks Technology Radar"
  date: "2015-11-10 (published); 2016-04-05 (last updated), as printed"
  url: "https://www.thoughtworks.com/radar/techniques/decoupling-deployment-from-release"
  accessed: "2026-11-20"
  note: "Technique entry in ring Adopt in the November 2015 and April 2016 editions; the page marks it 'NOT ON THE CURRENT EDITION'. The description text appears only under the April 2016 entry (it recommends using 'Deployment' for deploying a change and 'Release' for exposing a feature change to end users, and notes feature toggles and dark launches let teams deploy more often without releasing features); the November 2015 entry carries no text on the page. The page credits no person or source for the distinction."

fowler-feature-toggles:
  title: "Feature Toggles (aka Feature Flags)"
  author: "Pete Hodgson"
  org: "martinfowler.com"
  date: "2017-10-09 (printed date; series first published 2016-01-19, complete article 2016-02-08)"
  url: "https://martinfowler.com/articles/feature-toggles.html"
  accessed: "2026-11-20"
  note: "Article by Pete Hodgson hosted on martinfowler.com (printed date 9 October 2017; first instalment 19 January 2016, complete article 8 February 2016). Distinguishes release, experiment, ops and permissioning toggles by lifespan. Says release toggles allow incomplete and untested code paths to ship to production as latent code that may never be turned on, and calls them the most common way to implement 'the Continuous Delivery principle of separating [feature] release from [code] deployment'. Says teams should view toggles as inventory with a carrying cost and be proactive in removing flags that are no longer needed, that release toggles should generally not stick around much longer than a week or two, and that a small number of long-lived kill switches may remain."

google-agentic-sre:
  title: "AI in SRE: Where and how Google is deploying agentic AI to improve operations"
  author: "Stevan Malesevic (Distinguished Software Engineer) and Christopher Heiser (Distinguished Site Reliability Engineer)"
  org: "Google Cloud Blog (DevOps & SRE)"
  date: "2026-05-28"
  url: "https://cloud.google.com/blog/products/devops-sre/how-google-sre-is-using-agentic-ai-to-improve-operations"
  accessed: "2026-11-20"
  note: "One operator's account (not a study) of agents layered on its incident management: consolidating and summarising incident communications, creating handoff documents and drafting postmortems, and investigation agents that use observability data and in some cases mitigate autonomously. Says it relies on consistent controls to prevent unwanted mutations of production state, and that an agentic approach does not necessarily imply removing people from the process, specifically for higher-risk services and features. Gives no outcome figures. The browser tab title differs from the on-page heading. Links a whitepaper that was not read."

dora-streamlining-change-approval:
  title: "Streamlining change approval"
  author: "DORA (DevOps Research and Assessment)"
  org: "Google, published on dora.dev (capability page; tab title 'DORA | Capabilities: Streamlining change approval')"
  date: "2025-10-30 (last updated, as printed)"
  url: "https://dora.dev/capabilities/streamlining-change-approval/"
  accessed: "2026-11-20"
  note: "Says change approvals are best implemented through peer review during the development process, supplemented by automation to detect, prevent and correct bad changes early, and that heavyweight external approval processes have a negative impact on software delivery performance. Treats segregation of duties, a common regulatory requirement, as satisfiable by peer review and gives the change advisory board a strategic role. Does not discuss an external control that mandates approval by an outside party. Carries the 'core' tag; cites the 2019 State of DevOps Report."

keep-a-changelog:
  title: "Keep a Changelog 1.1.0"
  author: "Olivier Lacan (page: 'created and maintained by Olivier Lacan, and designed by Tyler Fortune')"
  org: "keepachangelog.com"
  date: "version 1.1.0 (its own changelog dates 1.1.0 as 2019-02-15)"
  url: "https://keepachangelog.com/en/1.1.0/"
  accessed: "2026-11-20"
  note: "States that changelogs are for humans, not machines; advises against dumping git logs into changelogs; says there should be an entry for every single version; groups changes under six types (Added, Changed, Deprecated, Removed, Fixed, Security). Says 'Mention whether you follow Semantic Versioning' and does not recommend it outright."

keep-a-changelog-2:
  title: "Keep a Changelog 2.0.0"
  author: "Olivier Lacan (page: 'created and maintained by Olivier Lacan, and designed by Tyler Fortune')"
  org: "keepachangelog.com"
  date: "2026-06-07 (page: 'Published on June 7th, 2026')"
  url: "https://keepachangelog.com/en/2.0.0/"
  accessed: "2026-11-20"
  note: "The 2.0.0 edition ('Published on June 7th, 2026'). Says changelogs are for humans, not machines; says not to paste a git log; says 'You do not have to use Semantic Versioning'; and draws the line as 'machines can draft, but humans curate', a phrase found on this edition only."

fowler-dark-launching:
  title: "Dark Launching"
  author: "Martin Fowler"
  org: "martinfowler.com (bliki)"
  date: "2020-04-29"
  url: "https://martinfowler.com/bliki/DarkLaunching.html"
  accessed: "2026-11-20"
  note: "Defines dark launching as taking a new or changed back-end behavior and calling it from existing users without their being able to tell; says it assesses load and performance impact before a public announcement of the new capability; notes the term has been subject to semantic diffusion."

dora-continuous-delivery:
  title: "Continuous delivery"
  author: "DORA (DevOps Research and Assessment)"
  org: "Google, published on dora.dev (capability page; tab title 'DORA | Capabilities: Continuous delivery')"
  date: "not printed"
  url: "https://dora.dev/capabilities/continuous-delivery/"
  accessed: "2026-11-20"
  note: "Defines continuous delivery as the ability to release changes of all kinds on demand quickly, safely and sustainably, including releasing software and making changes to production in a low-risk way at any time, including during normal business hours, without impacting users. Carries the 'core' tag; no date printed."

istqb-test-completion:
  title: "test completion"
  author: "International Software Testing Qualifications Board (ISTQB)"
  org: "ISTQB Glossary"
  date: "term version 2 (no page date printed)"
  url: "https://glossary.istqb.org/en_US/term/test-completion"
  accessed: "2026-11-20"
  note: "Read through https://api.glossary.istqb.org/v1/terms/test-completion because the term page is JavaScript-rendered. Defines test completion as the activity that makes testware available for later use, leaves test environments in a satisfactory condition and communicates the results of testing to relevant stakeholders; synonym test closure."

sre-book-monitoring:
  title: "Monitoring Distributed Systems"
  author: "Rob Ewaschuk (edited by Betsy Beyer)"
  org: "Google, Site Reliability Engineering (first edition, O'Reilly Media), chapter 6; sre.google"
  date: "chapter page footer: Copyright 2017 Google, Inc. (the book's preface prints 2016 in its citation example)"
  url: "https://sre.google/sre-book/monitoring-distributed-systems/"
  accessed: "2026-11-20"
  note: "States that a monitoring system should address two questions, what is broken and why, and names the four golden signals as latency, traffic, errors and saturation. The page's browser tab title does not match the chapter; the on-page chapter heading is used."

sre-book-being-on-call:
  title: "Being On-Call"
  author: "Andrea Spadaccini (edited by Kavita Guliani)"
  org: "Google, Site Reliability Engineering (first edition, O'Reilly Media), chapter 11; sre.google"
  date: "chapter page footer: Copyright 2017 Google, Inc. (the book's preface prints 2016 in its citation example)"
  url: "https://sre.google/sre-book/being-on-call/"
  accessed: "2026-11-20"
  note: "After a page is acknowledged the on-call engineer is expected to triage the problem and work toward its resolution, possibly involving other team members and escalating as needed; many teams have both a primary and a secondary on-call rotation."

sre-book-managing-incidents:
  title: "Managing Incidents"
  author: "Andrew Stribblehill (edited by Kavita Guliani)"
  org: "Google, Site Reliability Engineering (first edition, O'Reilly Media), chapter 14; sre.google"
  date: "chapter page footer: Copyright 2017 Google, Inc. (the book's preface prints 2016 in its citation example)"
  url: "https://sre.google/sre-book/managing-incidents/"
  accessed: "2026-11-20"
  note: "Google's incident management system is based on the Incident Command System. Lists four roles (incident command, operational work, communication, planning) and says the operations team should be the only group modifying the system during an incident. The chapter does not use the title 'communications lead'."

nist-800-61r3:
  title: "Incident Response Recommendations and Considerations for Cybersecurity Risk Management: A CSF 2.0 Community Profile"
  author: "Alex Nelson, Sanjay Rekhi, Murugiah Souppaya, Karen Scarfone"
  org: "National Institute of Standards and Technology (NIST)"
  date: "April 2025 (final, 2025-04-03)"
  url: "https://csrc.nist.gov/pubs/sp/800/61/r3/final"
  accessed: "2026-11-20"
  note: "NIST SP 800-61 Rev. 3, DOI https://doi.org/10.6028/NIST.SP.800-61r3. Covers cybersecurity incident response: all six Cybersecurity Framework (CSF) 2.0 Functions (Govern, Identify, Protect, Detect, Respond, Recover) play a part, and lessons learned from performing all activities in all Functions are fed into Improvement (the Improvement Category, ID.IM, in the Identify Function). Supersedes SP 800-61 Rev. 2 (2012), which was withdrawn on 2025-04-03. The CSRC page prints the first author as 'Alexander Nelson'; the PDF prints 'Alex Nelson'."

dora-monitoring-observability:
  title: "Monitoring and observability"
  author: "DORA (DevOps Research and Assessment)"
  org: "Google, published on dora.dev (capability page; tab title 'DORA | Capabilities: Monitoring and observability')"
  date: "not printed"
  url: "https://dora.dev/capabilities/monitoring-and-observability/"
  accessed: "2026-11-20"
  note: "Distinguishes monitoring (tooling or a technical solution that lets teams watch and understand the state of their systems) from observability (lets teams actively debug their system) and says a comprehensive monitoring and observability solution, with a number of other technical practices, contributes positively to continuous delivery. Carries the 'core' tag; no date printed."

ahmed-incident-llm:
  title: "Recommending Root-Cause and Mitigation Steps for Cloud Incidents using Large Language Models"
  author: "Toufique Ahmed, Supriyo Ghosh, Chetan Bansal, Tom Zimmermann, Xuchao Zhang, Saravan Rajmohan"
  org: "Microsoft Research; ICSE 2023"
  date: "May 2023 (as printed on the publication page)"
  url: "https://www.microsoft.com/en-us/research/publication/recommending-root-cause-and-mitigation-steps-for-cloud-incidents-using-large-language-models/"
  accessed: "2026-11-20"
  note: "Publication page prints 'ICSE 2023 | May 2023'. The abstract describes the first large-scale study to evaluate the effectiveness of large language models for helping engineers root cause and mitigate production incidents, on more than 40,000 incidents, in zero-shot, fine-tuned and multi-task settings, with human evaluation by incident owners."

chen-rcacopilot:
  title: "Automatic Root Cause Analysis via Large Language Models for Cloud Incidents"
  author: "Yinfang Chen, Huaibing Xie, Minghua Ma, Yu Kang, Xin Gao, Liu Shi, Yunjie Cao, Xuedong Gao, Hao Fan, Ming Wen, Jun Zeng, Supriyo Ghosh, Xuchao Zhang, Chaoyun Zhang, Qingwei Lin, Saravan Rajmohan, Dongmei Zhang, Tianyin Xu"
  org: "arXiv (cs.SE)"
  date: "v1 25 May 2023; v4 last revised 13 Nov 2023"
  url: "https://arxiv.org/abs/2305.15778"
  accessed: "2026-11-20"
  note: "Preprint; the arXiv page prints no venue. Describes a root-cause tool that matches incoming incidents to the corresponding incident handlers based on their alert types, aggregates the critical runtime diagnostic information, predicts the incident's root cause category and provides an explanatory narrative; reports RCA accuracy of up to 0.766, evaluated on a year's worth of incidents from the authors' own cloud provider (named in the abstract)."

istqb-agile-tester-2014:
  title: "Certified Tester Foundation Level Extension Syllabus Agile Tester, Version 2014"
  author: "International Software Testing Qualifications Board (ISTQB), Foundation Level Extension Agile Tester Working Group"
  org: "ISTQB"
  date: "2014-09-30 (Version 2014)"
  url: "https://astqb.org/assets/documents/ISTQB-Foundation-Agile-Syllabus.pdf"
  accessed: "2026-11-20"
  note: "Agile Tester syllabus. States that each test level has its own definition of done, lists INVEST for user stories and covers acceptance criteria. Currency: ISTQB announces that exams and training for this certification end on 6 May 2027 (English) and 6 November 2027 (non-English); the syllabus is superseded in scope by CTFL v4.0 and CTAL-AT v2.0."

gotel-finkelstein-1994:
  title: "An analysis of the requirements traceability problem"
  author: "Orlena C. Z. Gotel, Anthony C. W. Finkelstein"
  org: "Proceedings of 1st International Conference on Requirements Engineering, IEEE Computer Society Press"
  date: "1994 (pp. 94-101)"
  url: "https://discovery.ucl.ac.uk/id/eprint/749/"
  accessed: "2026-11-20"
  note: "Defines requirements traceability as the ability to describe and follow the life of a requirement in both a forwards and backwards direction, from its origins through development and specification to deployment and use. Cited for that definition only. The record page prints the venue as '1st International Conference on Requirements Engineering' (no acronym); the paper PDF is at https://discovery.ucl.ac.uk/id/eprint/749/1/2.2_rtprob.pdf."

nasa-swe-052:
  title: "SWE-052 - Bidirectional Traceability"
  author: "not printed"
  org: "NASA, NASA Software Engineering and Assurance Handbook (NASA-HDBK-2203)"
  date: "handbook cover prints NASA-HDBK-2203B, approved 2022-03-08; the page itself is not dated"
  url: "https://swehb.nasa.gov/spaces/SWEHBVD/pages/102695427/SWE-052+-+Bidirectional+Traceability"
  accessed: "2026-11-20"
  note: "Handbook page for requirement SWE-052 (NPR 7150.2D, 3.12.1): bi-directional traceability between higher-level requirements and software requirements, requirements and hazards, requirements and design components, design components and code, requirements and verification, and requirements and non-conformances. The requirement applies by software class (A, B, C; D; F per the table), not equally to all. States that traceability can point out requirements that are not tested and tests that do not serve requirements, and that the matrix is completed left to right early in the phase and maintained throughout the life of the project."

rath-traceability-wild-2018:
  title: "Traceability in the Wild: Automatically Augmenting Incomplete Trace Links"
  author: "Michael Rath, Jacob Rendall, Jin L.C. Guo, Jane Cleland-Huang, Patrick Mäder"
  org: "ICSE '18: 40th International Conference on Software Engineering, Gothenburg, Sweden, 27 May to 3 June 2018"
  date: "2018"
  url: "https://doi.org/10.1145/3180155.3180207"
  accessed: "2026-11-20"
  note: "Facts read from the authors' arXiv preprint (https://arxiv.org/abs/1804.02433, v1 6 April 2018; its PDF prints an ACM Reference Format with the DOI), not from the ACM record. Abstract: an analysis of six open source projects showed that on average only 60% of the commits were linked to specific issues. The study addresses missing commit-to-issue links. Not a general finding about traceability."

safe-ia-facilitators-guide:
  title: "SAFe Inspect and Adapt Facilitator's Guide"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed"
  url: "https://framework.scaledagile.com/wp-content/uploads/2026/03/SAFe-Inspect-and-Adapt-Facilitators-Guide.pdf"
  accessed: "2026-11-20"
  note: "Four-page guide. The event has three primary parts, typically facilitated by the Release Train Engineer (RTE). Part 3 is a brief retrospective followed by a structured, root-cause problem-solving workshop; the guide names Root Cause Analysis, Fishbone, 5 Whys and Pareto. It does not list a six-step workshop."

safe-rte:
  title: "Release Train Engineer"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/release-train-engineer"
  accessed: "2026-11-20"
  note: "Defines the Release Train Engineer (RTE) as a servant leader and ART coach who facilitates ART events and processes, and supports teams in delivering value."

safe-iteration-retrospective:
  title: "Iteration Retrospective"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2026-03-18 (as printed)"
  url: "https://framework.scaledagile.com/iteration-retrospective/"
  accessed: "2026-11-20"
  note: "Tab title 'Extended Guidance - Iteration Retrospective'. Describes the Iteration Retrospective as a regular event held at the end of each iteration during which Agile Teams review their results to identify improvements for future work."

agile-manifesto-principles:
  title: "Principles behind the Agile Manifesto"
  author: "not printed on this page (the Manifesto home page prints '(c) 2001, the above authors' above a list of 17 names)"
  org: "agilemanifesto.org"
  date: "not printed on this page; Manifesto home page '(c) 2001'"
  url: "https://agilemanifesto.org/principles.html"
  accessed: "2026-11-20"
  note: "Twelve unnumbered statements; the last reads 'At regular intervals, the team reflects on how to become more effective, then tunes and adjusts its behavior accordingly.'"
