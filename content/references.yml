safe-team-backlog-refinement:
  title: "Team Backlog Refinement"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2026-03-18 (as printed)"
  url: "https://framework.scaledagile.com/team-backlog-refinement/"
  accessed: "2026-11-20"
  note: "Tab title 'Extended Guidance - Team Backlog Refinement'. Describes refinement as an event that helps Agile Teams clarify and prepare upcoming stories and features, with regular activities of removing outdated stories, discovering new ones and defining acceptance criteria. The page does not say 'continuously' or 'sized'."

safe-built-in-quality:
  title: "Built-In Quality"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/built-in-quality"
  accessed: "2026-11-20"
  note: "Tab title 'Extended Guidance - Built-In Quality'. Defines Built-In Quality as a set of practices to help ensure that the outputs of Agile teams in business and technology domains meet appropriate quality standards throughout the process of creating customer value. Only the opening definition is relied on; the rest is behind SAFe's login wall."

safe-cdp:
  title: "Continuous Delivery Pipeline"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2025-02-06 (as printed)"
  url: "https://framework.scaledagile.com/continuous-delivery-pipeline/"
  accessed: "2026-11-20"
  note: "Describes the Continuous Delivery Pipeline as the workflows, activities, and automation needed to guide new functionality from ideation to an on-demand release of value, with four aspects: continuous exploration, continuous integration, continuous deployment, and release on demand."

safe-continuous-exploration:
  title: "Continuous Exploration"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/continuous-exploration/"
  accessed: "2026-11-20"
  note: "Tab title 'Extended Guidance - Continuous Exploration'. Describes continuous exploration as an aspect of the Continuous Delivery Pipeline that drives innovation and fosters alignment on what should be built by continually exploring the market and customer needs, defining a vision, roadmap, and set of features for a solution. Part of the page is behind a login wall; only the definition is relied on."

safe-continuous-integration:
  title: "Continuous Integration"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/continuous-integration/"
  accessed: "2026-11-20"
  note: "Describes continuous integration as an aspect of the Continuous Delivery Pipeline in which new functionality is developed, tested, integrated, and validated in preparation for deployment and release; names four activities: Develop, Build, Test end-to-end, Stage."

safe-continuous-deployment:
  title: "Continuous Deployment"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/continuous-deployment"
  accessed: "2026-11-20"
  note: "Tab title 'Extended Guidance - Continuous Deployment'. Describes continuous deployment as an aspect of the Continuous Delivery Pipeline that automates the migration of new functionality from a staging environment to production, where it is made available for release; says it is optimal to separate the deployment process from releasing; names four practices (Deploy, Verify, Monitor, Respond)."

safe-release-on-demand:
  title: "Release on Demand"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2025-02-25 (as printed)"
  url: "https://framework.scaledagile.com/release-on-demand"
  accessed: "2026-11-20"
  note: "Release on demand is an aspect of the Continuous Delivery Pipeline that 'releases new functionality immediately or incrementally based on business and customer needs'; 'releases are decoupled from the work to deploy the functionality'. The names of its four activities sit behind SAFe's login wall and are not cited."

dora-ai-capabilities-intro:
  title: "Introducing the DORA AI Capabilities Model: 7 keys to succeeding in AI-assisted software development"
  author: "Kevin M. Storer; Derek DeBellis"
  org: "Google Cloud Blog"
  date: "2025-09-23"
  url: "https://cloud.google.com/blog/products/ai-machine-learning/introducing-doras-inaugural-ai-capabilities-model"
  accessed: "2026-11-20"
  note: "Tab title 'Introducing DORA's inaugural AI Capabilities Model | Google Cloud Blog'. Names seven capabilities in this order: clear and communicated AI stance; healthy data ecosystems; AI-accessible internal data; strong version control practices; working in small batches; user-centric focus; quality internal platforms. Says working in small batches is especially powerful in an AI-assisted environment and that, in the absence of a user-centric focus, AI adoption can have a negative impact on team performance."

wake-invest:
  title: "INVEST in Good Stories, and SMART Tasks"
  author: "Bill Wake"
  org: "XP123 (author's site)"
  date: "17 August 2003"
  url: "https://xp123.com/invest-in-good-stories-and-smart-tasks/"
  accessed: "2026-11-20"
  note: "Self-published on the author's site ('Posted on August 17, 2003 by Bill Wake'; a postscript was added 2011-02-16). Lists INVEST for stories (Independent, Negotiable, Valuable, Estimable, Small, Testable) and SMART for tasks (Specific, Measurable, Achievable, Relevant, Time-boxed). The author states that he developed the INVEST acronym."

istqb-acceptance-criteria:
  title: "acceptance criteria"
  author: "International Software Testing Qualifications Board (ISTQB)"
  org: "ISTQB Glossary"
  date: "term version 3 (no page date printed)"
  url: "https://glossary.istqb.org/en_US/term/acceptance-criteria"
  accessed: "2026-11-20"
  note: "Text read from the glossary's own API (https://api.glossary.istqb.org/v1/terms/acceptance-criteria) because the page is JavaScript-rendered. Current definition (version 3): the criteria that a work product must satisfy to be accepted by the stakeholders. Versions 1 and 2 use different wording (exit criteria; component or system; user, customer or authorised entity); the site relies on version 3 only."

istqb-testability:
  title: "testability"
  author: "International Software Testing Qualifications Board (ISTQB)"
  org: "ISTQB Glossary"
  date: "term version 3 (no page date printed)"
  url: "https://glossary.istqb.org/en_US/term/testability"
  accessed: "2026-11-20"
  note: "Text read from the glossary's own API (https://api.glossary.istqb.org/v1/terms/testability) because the term page loads its text with JavaScript. Defines testability as the degree to which test conditions can be established for a component or system, and tests can be performed to determine whether those test conditions have been met."

fowler-given-when-then:
  title: "Given When Then"
  author: "Martin Fowler"
  org: "martinfowler.com (bliki)"
  date: "2013-08-21"
  url: "https://martinfowler.com/bliki/GivenWhenThen.html"
  accessed: "2026-11-20"
  note: "Describes given-when-then as an approach developed by Daniel Terhorst-North and Chris Matts as part of Behavior-Driven Development; a footnote says Terhorst-North credits Ivan Moore for significant inspiration."

agile-alliance-dor:
  title: "Definition of Ready"
  author: "not printed"
  org: "Agile Alliance"
  date: "not printed"
  url: "https://agilealliance.org/glossary/definition-of-ready/"
  accessed: "2026-11-20"
  note: "Agile Glossary entry (tab title 'What is Definition of Ready? | Agile Alliance'). Describes the team making explicit and visible the criteria (generally based on the INVEST matrix) that a user story must meet before being accepted into the upcoming iteration. Does not mention the Scrum Guide and prints no author or date. Its Origins section is not relied on."

requirements-ambiguity-llm:
  title: "Requirements Ambiguity Detection and Explanation with LLMs: An Industrial Study"
  author: "Sarmad Bashir, Alessio Ferrari, Muhammad Abbas Khan, Per Erik Strandberg, Zulqarnain Haider, Mehrdad Saadatmand, Markus Bohlin"
  org: "41st International Conference on Software Maintenance and Evolution (ICSME 2025)"
  date: "2025-09"
  url: "https://www.ipr.mdu.se/pdf_publications/7221.pdf"
  accessed: "2026-11-20"
  note: "Industrial study of large language models detecting and explaining ambiguity in real-world requirements by in-context learning; ten in-context demonstrations outperform none at classifying ambiguous requirements, with human evaluation by eight industry experts. The PDF prints title and authors only; venue, month, pages 620-631 and DOI 10.1109/ICSME64153.2025.00063 are printed on the Malardalen University publication record (https://www.ipr.mdu.se/publications/7221-)."

bockeler-sdd:
  title: "Understanding Spec-Driven-Development: Kiro, spec-kit, and Tessl"
  author: "Birgitta Böckeler"
  org: "martinfowler.com (Exploring Gen AI series)"
  date: "2025-10-15"
  url: "https://martinfowler.com/articles/exploring-gen-ai/sdd-3-tools.html"
  accessed: "2026-11-20"
  note: "Defines three degrees of commitment to a specification: spec-first, spec-anchored and spec-as-source, and describes three spec-driven tools. The title names three products; site prose names none."

spec-kit-sdd:
  title: "Specification-Driven Development (SDD)"
  author: "not printed"
  org: "GitHub (github/spec-kit repository)"
  date: "not printed"
  url: "https://github.com/github/spec-kit/blob/main/spec-driven.md"
  accessed: "2026-11-20"
  note: "Methodology document in the open-source spec-kit repository; text read from https://raw.githubusercontent.com/github/spec-kit/main/spec-driven.md (same file; github.com refuses plain requests). Says the templates mandate the use of [NEEDS CLARIFICATION] markers where a prompt does not specify something ('Don't guess') and include checklists that act as 'unit tests' for the specification. Defines a constitution with a Simplicity Gate (Article VII) and an Anti-Abstraction Gate (Article VIII), and says the LLM cannot proceed without either passing the gates or documenting justified exceptions in a 'Complexity Tracking' section."

sei-atam:
  title: "The Architecture Tradeoff Analysis Method"
  author: "Rick Kazman, Mark Klein, Mario Barbacci, Tom Longstaff, Howard Lipson, Jeromy Carriere"
  org: "Software Engineering Institute, Carnegie Mellon University (CMU/SEI-98-TR-008, ESC-TR-98-008)"
  date: "1998-07"
  url: "https://www.sei.cmu.edu/documents/1186/1998_005_001_16646.pdf"
  accessed: "2026-11-20"
  note: "1998 technical report. Its abstract describes ATAM as a structured technique for understanding the tradeoffs inherent in the architectures of software-intensive systems. It elicits scenarios and evaluates each quality attribute in turn but does not describe prioritising scenarios; that is in the 2000 report (sei-atam-2000)."

sei-atam-2000:
  title: "ATAM: Method for Architecture Evaluation"
  author: "Rick Kazman, Mark Klein, Paul Clements"
  org: "Software Engineering Institute, Carnegie Mellon University (CMU/SEI-2000-TR-004)"
  date: "2000-08"
  url: "https://www.sei.cmu.edu/documents/629/2000_005_001_13706.pdf"
  accessed: "2026-11-20"
  note: "2000 technical report (catalogue page https://www.sei.cmu.edu/library/atam-method-for-architecture-evaluation/). Its abstract calls ATAM a technique for analyzing software architectures. Includes a step to brainstorm and prioritize scenarios, prioritized via a voting process, and utility trees that give a prioritized list of scenarios."

threat-modeling-manifesto:
  title: "Threat Modeling Manifesto"
  author: "Working group: Zoe Braiterman, Adam Shostack, Jonathan Marcil, Stephen de Vries, Irene Michlin, Kim Wuyts, Robert Hurlbut, Brook S.E. Schoenfield, Fraser Scott, Matthew Coles, Chris Romeo, Alyssa Miller, Izar Tarandach, Avi Douglen, Marc French"
  org: "Threat Modeling Manifesto working group"
  date: "not printed"
  url: "https://www.threatmodelingmanifesto.org/"
  accessed: "2026-11-20"
  note: "Authors in the order printed on the page. States that when the working group threat models, it asks four key questions: What are we working on? What can go wrong? What are we going to do about it? Did we do a good enough job? No publication date is printed on the page or its linked PDF; licensed CC BY 4.0."

owasp-threat-modeling-cs:
  title: "Threat Modeling Cheat Sheet"
  author: "not printed (page footer credits 'Cheat Sheets Series Team')"
  org: "OWASP Cheat Sheet Series"
  date: "not printed"
  url: "https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html"
  accessed: "2026-11-20"
  note: "Breaks threat modeling into four basic steps: application decomposition, threat identification and ranking, mitigations, and review and validation, guided by the four Threat Modeling Manifesto questions. Tab title: 'Threat Modeling - OWASP Cheat Sheet Series'."

fowler-evodb:
  title: "Evolutionary Database Design"
  author: "Pramod Sadalage and Martin Fowler"
  org: "martinfowler.com"
  date: "May 2016 (complete rewrite; original publication January 2003)"
  url: "https://martinfowler.com/articles/evodb.html"
  accessed: "2026-11-20"
  note: "Describes representing every change to the database as a database migration script that is version controlled together with application code changes, with tools that automate applying them. The page's revisions list records 'May 2016: Complete rewrite' and 'January 2003: Original publication'."

fowler-blue-green:
  title: "Blue Green Deployment"
  author: "Martin Fowler"
  org: "martinfowler.com (bliki)"
  date: "1 March 2010 (page also records an update on 2015-06-05 adding the database paragraph)"
  url: "https://martinfowler.com/bliki/BlueGreenDeployment.html"
  accessed: "2026-11-20"
  note: "Describes two production environments kept as identical as possible, one of them live at any time; the switch is made at the router, and rollback is switching it back. On databases, says the trick is to separate the deployment of schema changes from application upgrades."

safe-system-architect:
  title: "System Architect"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/system-architect/"
  accessed: "2026-11-20"
  note: "Describes the role as responsible for defining and communicating a shared technical and architectural vision for the solutions developed by an Agile Release Train, by defining enablers, participating in solution definition and outlining non-functional requirements."

google-eng-practices-small-cls:
  title: "Small CLs"
  author: "not printed"
  org: "Google (repository google/eng-practices, 'Google Engineering Practices Documentation'; CC-By 3.0 per the repository README)"
  date: "not printed"
  url: "https://github.com/google/eng-practices/blob/master/review/developer/small-cls.md"
  accessed: "2026-11-20"
  note: "Text read from raw.githubusercontent.com (same file); rendered copy at https://google.github.io/eng-practices/review/developer/small-cls.html. Says small, simple changes are reviewed more quickly and more thoroughly, are less likely to introduce bugs and are simpler to roll back, and that the right size is a minimal change that addresses just one thing and includes related test code."

google-eng-practices-review:
  title: "What to look for in a code review"
  author: "not printed"
  org: "Google (repository google/eng-practices, 'Google Engineering Practices Documentation'; CC-By 3.0 per the repository README)"
  date: "not printed"
  url: "https://github.com/google/eng-practices/blob/master/review/reviewer/looking-for.md"
  accessed: "2026-11-20"
  note: "Text read from raw.githubusercontent.com (same file); rendered copy at https://google.github.io/eng-practices/review/reviewer/looking-for.html. Section headings in order: Design, Functionality, Complexity, Tests, Naming, Comments, Style, Consistency, Documentation. Under Tests: ask for unit, integration or end-to-end tests as appropriate for the change."

sre-book-release-engineering:
  title: "Release Engineering"
  author: "Dinah McNutt (edited by Betsy Beyer and Tim Harvey)"
  org: "Google, Site Reliability Engineering (book, first edition), O'Reilly Media; sre.google"
  date: "chapter page footer: Copyright © 2017 Google, Inc.; the book's preface prints 'Copyright 2016 Google, Inc.' in its citation example"
  url: "https://sre.google/sre-book/release-engineering/"
  accessed: "2026-11-20"
  note: "Chapter 8 of the SRE book. Describes hermetic builds (the same revision built on different machines gives identical results; builds depend on known versions of build tools, such as compilers, and dependencies, such as libraries); gated operations (approving source code changes, specifying the actions to perform during a release, creating a new release, approving the initial integration proposal and subsequent cherry picks, deploying a new release, and changes to a project's build configuration); rollouts that fit the risk profile of a service, such as rolling out to successive clusters over a period of several hours or starting in one cluster and expanding exponentially until all clusters are updated; a canary as a few jobs in production after system tests; and release engineers and SREs working together on canarying changes, pushing out new releases without interrupting services and rolling back features that demonstrate problems. The chapter does not use the word 'incubation'."

humble-farley-cd:
  title: "Continuous Delivery: Reliable Software Releases through Build, Test, and Deployment Automation"
  author: "Jez Humble, David Farley"
  org: "Addison-Wesley Professional (Addison-Wesley Signature Series (Fowler))"
  date: "Published Jul 27, 2010 (InformIT); 'Copyright 2011' also printed; 1st edition; ISBN-13 978-0-321-60191-9"
  url: "https://www.informit.com/store/continuous-delivery-reliable-software-releases-through-9780321601919"
  accessed: "2026-11-20"
  note: "Only the catalogue page, the table of contents and the free sample chapter 5, 'Continuous Delivery: Anatomy of the Deployment Pipeline' (https://www.informit.com/articles/article.aspx?p=1621865, 7 September 2010), were readable. The table of contents titles chapter 7 'Commit Testing Stage', chapter 8 'Automated Acceptance Testing' and chapter 10 'Deploying and Releasing Applications'. The sample chapter has a section 'Only Build Your Binaries Once' and says a pipeline instance is created upon every check-in and that the commit stage should ideally take less than five minutes. Nothing is stated about what chapters 7, 8 and 10 say; their text was not readable."

slsa-build-track-basics:
  title: "Build: Track Basics"
