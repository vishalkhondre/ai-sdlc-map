safe-guardrails:
  title: "Lean Budget Guardrails"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/guardrails/"
  accessed: "2026-11-20"
  note: "Tab title 'Extended Guidance - Lean Budget Guardrails'. Defines Lean Budget Guardrails as describing the policies and practices for budgeting, spending, and governance for a specific portfolio."

safe-strategic-themes:
  title: "Strategic Themes"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/strategic-themes/"
  accessed: "2026-11-20"
  note: "Defines strategic themes as portfolio-level business objectives that provide competitive differentiation and strategic advantage, and says they connect the enterprise strategy to a portfolio. The readable text does not describe them as decision criteria for the portfolio backlog."

safe-epic:
  title: "Epic"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2025-03-11 (as printed)"
  url: "https://framework.scaledagile.com/epic/"
  accessed: "2026-11-20"
  note: "Defines an Epic as a significant solution development initiative and calls epics significant initiatives. Most of the article is behind SAFe's login wall."

safe-wsjf:
  title: "Weighted Shortest Job First"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/wsjf"
  accessed: "2026-11-20"
  note: "Tab title 'Extended Guidance - WSJF'. States that in SAFe, WSJF is estimated as the relative cost of delay divided by the relative job duration, and lists the inputs as relative user and business value, time criticality, risk reduction and/or opportunity enablement, and job size. Opens with an epigraph attributed to Don Reinertsen, The Principles of Product Development Flow."

safe-cost-of-delay:
  title: "Cost of Delay"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed"
  url: "https://framework.scaledagile.com/blog/glossary_term/cost-of-delay"
  accessed: "2026-11-20"
  note: "Glossary-term post. Describes Cost of Delay as the numerator in WSJF prioritization, representing the money or value that will be lost by delaying or not doing a job for a time period relative to other jobs."

safe-art:
  title: "Agile Release Train"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/agile-release-train"
  accessed: "2026-11-20"
  note: "Defines the Agile Release Train (ART) as a long-lived team of Agile teams that incrementally develops, delivers, and often operates one or more solutions in a development value stream. The summary names the key roles Product Management, System Architect, Release Train Engineer (RTE) and Business Owners; the role definitions are on their own pages."

safe-agile-teams:
  title: "Agile Teams"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed in readable text"
  url: "https://framework.scaledagile.com/agile-teams"
  accessed: "2026-11-20"
  note: "Defines an Agile Team as a cross-functional group of typically ten or fewer individuals with all the skills necessary to define, build, test, and deliver value to their customer. Names the Product Owner and Scrum Master/Team Coach roles without defining them in the readable text."

safe-features:
  title: "Features and Capabilities"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2025-02-24 (as printed)"
  url: "https://framework.scaledagile.com/features-and-capabilities"
  accessed: "2026-11-20"
  note: "Defines a Feature as solution functionality that delivers business value, fulfills a stakeholder need, and is sized to be delivered by an Agile Release Train within a PI; defines a Capability as large solution functionality whose implementation often spans multiple ARTs and is sized to be delivered within a PI."

safe-pi-planning:
  title: "PI Planning"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2026-03-15 (as printed)"
  url: "https://framework.scaledagile.com/pi-planning/"
  accessed: "2026-11-20"
  note: "Defines PI Planning as a cadence-based event for the entire ART that aligns teams and stakeholders to a shared mission and vision; says it is typically a 2-day event that takes place every 8-12 weeks. Names its outputs as committed PI objectives from the Agile Teams and an ART planning board that reflects feature delivery dates and dependencies. Uses the term 'ART planning board'."

safe-glossary:
  title: "SAFe Glossary"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "not printed"
  url: "https://framework.scaledagile.com/glossary/"
  accessed: "2026-11-20"
  note: "Glossary of SAFe terms; prints no date. Entries relied on: System Demo ('provides stakeholders an integrated view of new features for the most recent iteration delivered by all the teams on the ART'), Iteration Goals ('a high-level summary of the business and technical goals that an Agile Team agrees to accomplish in an Iteration'), Definition of Done ('specifies the requirements for completeness of a work product or increment of value'), ART Planning Board and Lean Budgets. The glossary has no entry for 'Definition of Ready' or 'Program Board'."

safe-inspect-and-adapt:
  title: "Inspect and Adapt"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2026-03-20 (as printed)"
  url: "https://framework.scaledagile.com/inspect-and-adapt"
  accessed: "2026-11-20"
  note: "Describes Inspect and Adapt as a significant event held at the end of each PI, structured into three parts (the PI System Demo, a quantitative and qualitative measurement review, and a retrospective and problem-solving workshop), whose improvement backlog items go into the ART Backlog for consideration in the next PI Planning event. Quotes the twelfth Agile Manifesto principle and says 'The I&A amplifies the original principle'. The page says nothing about AI-Native SAFe; the replacement is stated on the Sense and Respond page. Partly behind SAFe's login wall."

safe-story:
  title: "Story"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2025-01-27 (as printed)"
  url: "https://framework.scaledagile.com/story"
  accessed: "2026-11-20"
  note: "Describes stories as short descriptions of a small piece of desired functionality written from the user's perspective; says each story focuses on a specific behavior that can be developed in incremental steps and that keeping stories small ensures they can be completed in a single iteration. States that SAFe describes four tiers of work items: Epic, Capability, Feature, and Story."

safe-iteration-planning:
  title: "Iteration Planning"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2026-03-18 (as printed)"
  url: "https://framework.scaledagile.com/iteration-planning/"
  accessed: "2026-11-20"
  note: "Tab title 'Extended Guidance - Iteration Planning'. Says the team defines, organizes, and commits to the work for the next iteration, collaboratively defining Iteration Goals and selecting stories from the team backlog; says the meeting is timeboxed to approximately 90 minutes for a two-week iteration."

safe-iterations:
  title: "Iterations"
  author: "not printed"
  org: "Scaled Agile, Inc."
  date: "last updated 2025-02-25 (as printed)"
  url: "https://framework.scaledagile.com/iterations/"
  accessed: "2026-11-20"
  note: "Defines iterations as a standard, fixed-duration timebox during which Agile Teams and ARTs individually and collectively deliver incremental customer value while working towards the PI objectives."

scrum-guide-2020:
  title: "The 2020 Scrum Guide"
  author: "Ken Schwaber and Jeff Sutherland"
  org: "ScrumGuides.org"
  date: "November 2020"
  url: "https://scrumguides.org/scrum-guide.html"
  accessed: "2026-11-20"
  note: "HTML port of the November 2020 Scrum Guide; the site's download page labels the English November 2020 edition the official current version. Licence CC BY-SA 4.0. Defines the Definition of Done as a formal description of the state of the Increment when it meets the quality measures required for the product, and as the Increment's commitment, as the Product Goal and the Sprint Goal are the commitments of the Product Backlog and the Sprint Backlog. Says the moment a Product Backlog item meets it an Increment is born, and an item that does not meet it cannot be released or even presented at the Sprint Review; an organisational Definition of Done is followed by all Scrum Teams as a minimum, otherwise the Scrum Team creates one appropriate for the product, and teams on one product must mutually define and comply with the same one; the Developers are accountable for instilling quality by adhering to it and are required to conform to it. Does not use the term Definition of Ready; says Product Backlog items that can be Done within one Sprint are deemed ready for selection in a Sprint Planning event. Describes refinement as an ongoing activity to add details, such as a description, order and size, with the Developers who will be doing the work responsible for the sizing, and makes the Product Owner accountable for effective Product Backlog management, including creating and clearly communicating Product Backlog items and ordering them. Names transparency, inspection and adaptation as the empirical Scrum pillars and says inspection without adaptation is considered pointless. The Sprint Retrospective plans ways to increase quality and effectiveness and inspects individuals, interactions, processes, tools and the Definition of Done; impactful improvements may be added to the Sprint Backlog for the next Sprint. An Increment may be delivered to stakeholders before the end of the Sprint, and the Sprint Review should never be considered a gate to releasing value."

dora-small-batches:
  title: "Working in small batches"
  author: "DORA (DevOps Research and Assessment)"
  org: "Google, published on dora.dev"
  date: "last updated 2025-12-08 (as printed)"
  url: "https://dora.dev/capabilities/working-in-small-batches/"
  accessed: "2026-11-20"
  note: "Capability page (tab title 'DORA | Capabilities: Working in small batches'; tagged core and AI). Advises breaking work into units that can be completed independently and in short timeframes, says working in small batches amplifies the positive impact of AI adoption on product performance, and says large changes are difficult to review, test and integrate safely."

dora-wip-limits:
  title: "Work in process limits"
  author: "DORA (DevOps Research and Assessment)"
  org: "Google, published on dora.dev"
  date: "not printed"
  url: "https://dora.dev/capabilities/wip-limits/"
  accessed: "2026-11-20"
  note: "Capability page (tab title 'DORA | Capabilities: Work in process limits'). Says research shows WIP limits help drive improvements in software delivery performance, particularly when combined with visual displays and feedback loops from monitoring. The page's own title is 'Work in process limits', not 'WIP limits'."

dora-ai-capabilities-impact:
  title: "From adoption to impact: Putting the DORA AI Capabilities Model to work"
  author: "Nathen Harvey (DORA Lead); Allison Park (Senior Product Marketing Manager)"
  org: "Google Cloud Blog"
  date: "2025-12-10"
  url: "https://cloud.google.com/blog/products/ai-machine-learning/from-adoption-to-impact-putting-the-dora-ai-capabilities-model-to-work"
  accessed: "2026-11-20"
  note: "Blog post on putting DORA's AI Capabilities Model to work; lists the same seven capabilities, in the same order, as the September 2025 post. Says AI can easily generate massive blocks of code, which are hard to review and test; says working in small batches ensures that speed translates to product performance rather than instability; calls version control a critical safety net essential for maintaining stability. The final URL has no trailing slash (the slash form redirects)."

oasis-soa-rm:
  title: "Reference Model for Service Oriented Architecture 1.0"
  author: "C. Matthew MacKenzie, Ken Laskey, Francis McCabe, Peter F Brown, Rebekah Metz (editors)"
  org: "OASIS"
  date: "2006-10-12 (OASIS Standard, as printed)"
  url: "https://docs.oasis-open.org/soa-rm/v1.0/soa-rm.html"
  accessed: "2026-11-20"
  note: "Section 1.1 defines a reference model as 'an abstract framework for understanding significant relationships among the entities of some environment'. The abstract adds 'within a service-oriented environment'. Document identifier soa-rm."

safe-framework-home:
  title: "Framework - Scaled Agile Framework (home page, 'Welcome to the Scaled Agile Framework')"
  author: "not printed"
