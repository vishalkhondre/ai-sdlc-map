  accessed: "2026-11-20"
  note: "Tab title 'Extended Guidance - Large Solution SAFe'. States that Large Solution SAFe is for enterprises building large and complex solutions that do not require portfolio concerns. Older page (last update 2022)."

safe-solution-train:
  title: "Solution Train"
  author: "not printed"
