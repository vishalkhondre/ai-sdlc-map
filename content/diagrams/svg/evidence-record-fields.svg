<svg width="1200" height="1141" viewBox="0 0 1200 1141" xmlns="http://www.w3.org/2000/svg" font-family='"Liberation Sans","DejaVu Sans",Arial,sans-serif' data-references="sarif-2-1-0 slsa-provenance in-toto-spec in-toto-usenix slsa-verifying bockeler-sensors slsa-build-requirements slsa-vsa"><title>One evidence record: its fields and who writes each</title><desc>A table of the nine fields of one evidence record, each beside the kind of writer allowed to fill it, with notes on how the overall status is derived. The kit observes and writes four fields: schema version, the version of the schema the record follows; change revision, the exact revision of the change the checks examined; configuration revision, the revision of the rules, thresholds and project configuration the run used; and kit version, the version of the kit and of the agent tooling it drove. The kit also writes expected checks, from the change and the project configuration: every check that applies to this change, each with its rule ID, listed before any result. The list is fixed before anything runs, results are written against it, and the record is complete only when every check has a result. Each validator writes check results: for each expected check, its rule ID, a status of passed, failed, skipped or could_not_run (could not run), the reason where it did not run, and a link to the full report. The review skill, or another agent, writes agent findings: each finding's rule ID, location and text, advisory only. A named person writes decisions: each decision's subject, a named decider, its state, pending or taken, and a reason code. The kit derives the overall status from the results and decisions by a rule the schema version states; nobody sets it directly. Arrows run from check results and from decisions into the overall status. A missing result shows as a missing entry, and a failed or could_not_run result prevents a positive overall status. A dashed line from agent findings stops short of the arrow: findings do not feed the overall status, and no finding changes a check's status or the overall status. A footer notes that a value a person enters where the kit should have observed it is marked as manual and names who entered it, and that a wrong machine field is put right by a new run, not by editing the record.</desc>
