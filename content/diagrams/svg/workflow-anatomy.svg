<svg width="1200" height="772" viewBox="0 0 1200 772" xmlns="http://www.w3.org/2000/svg" font-family='"Liberation Sans","DejaVu Sans",Arial,sans-serif' data-references="bockeler-harness bockeler-sensors openai-harness nist-ai-rmf nist-800-53 fowler-ci dora-ai-capabilities"><title>Anatomy of one workflow run: trigger, agent task, checks, human decision, evidence record and owner, with its failure paths</title><desc>One workflow run, read left to right in five boxes joined by arrows. Trigger (grey, workflow part): starts the run, which reads upstream records and the rules that apply. Agent task (purple, agent): writes code and tests; a review skill proposes findings tagged to rules; it never decides. Checks (coral, checks): validators the change's risk tier selects; only an explicit pass counts as a pass. Human decision (teal, people): a named person decides whether the change is ready, and the call is recorded by name. Evidence record (grey, record): checks, findings and decisions tied to the exact revision; the next workflow reads it. A dashed coral loop runs from Checks back to Agent task, labelled: violation, back to implementation, then the checks rerun. Below the run, a dotted grey arrow leads from Trigger to a precondition, and dashed coral arrows lead out to four failure paths, each naming who acts next; the fifth, a violation, loops back from Checks to Agent task. From Trigger: Before the run, a dotted grey precondition rather than a failure path: when inputs are missing or the change is too large to examine in full, the run stops and states what it is waiting for. From Agent task, Requirement ambiguous: the specification's owner answers and the specification is updated; nobody settles it in code. From Checks, Check could not run: it reports could_not_run, which is neither a pass nor a defect, so the run shows no positive status and whoever maintains the runner fixes it. From Human decision, Exception requested: whoever holds that decision right decides, and a granted exception is recorded with an owner, a reason and an expiry. Also from Human decision, Finding rejected: the reviewer records the rejection and its reason, so the review skill can be tuned against real misses. A grey arrow runs from the evidence record to the Feedback path band (grey): a defect found later is traced back to the run that should have caught it, and the record keeps where each return started, so a platform fix is not mistaken for a coding one. An arrow runs from the feedback path to the Owner band (teal, people): the one person accountable for the workflow itself receives the finding, which becomes a new test or a sharper rule. A legend gives the colours: purple agent, which proposes and never decides; coral checks, with dashed lines for failure paths; teal people, who make the named decisions; grey workflow parts and records. A credit line names the source of borrowed terms.</desc>
