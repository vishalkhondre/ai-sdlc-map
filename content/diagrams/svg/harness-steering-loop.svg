<text x="600" y="544" font-size="14" fill="#2C2C2A" font-weight="700" text-anchor="middle" letter-spacing="0.6">THE FEEDBACK PATH · THIS SITE’S EXTENSION OF THE STEERING LOOP</text>
<rect x="913" y="570" width="245" height="120" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.6"/>
<text x="929" y="600" font-size="16" fill="#4A1B0C" font-weight="700" text-anchor="start">A failure recurs</text>
<text x="929" y="626" font-size="15" fill="#4A1B0C" text-anchor="start">An issue happens more</text>
<text x="929" y="646" font-size="15" fill="#4A1B0C" text-anchor="start">than once. Reviewers see</text>
<text x="929" y="666" font-size="15" fill="#4A1B0C" text-anchor="start">what the agent missed.</text>
<line x1="911" y1="630" x2="871" y2="630" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="622" y="570" width="245" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/>
<text x="638" y="600" font-size="16" fill="#04342C" font-weight="700" text-anchor="start">People run the loop</text>
<text x="638" y="626" font-size="15" fill="#04342C" text-anchor="start">At the team's usual</text>
<text x="638" y="646" font-size="15" fill="#04342C" text-anchor="start">retrospective, someone asks</text>
<text x="638" y="666" font-size="15" fill="#04342C" text-anchor="start">which control should change.</text>
<line x1="620" y1="630" x2="580" y2="630" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="331" y="570" width="245" height="120" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1.6"/>
<text x="347" y="600" font-size="16" fill="#2C2C2A" font-weight="700" text-anchor="start">Trace it upstream</text>
<text x="347" y="626" font-size="15" fill="#2C2C2A" text-anchor="start">To the earliest control that</text>
<text x="347" y="646" font-size="15" fill="#2C2C2A" text-anchor="start">could have stopped it, not</text>
<text x="347" y="666" font-size="15" fill="#2C2C2A" text-anchor="start">where it was noticed.</text>
<line x1="329" y1="630" x2="289" y2="630" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="570" width="245" height="120" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1.6"/>
<text x="56" y="600" font-size="16" fill="#2C2C2A" font-weight="700" text-anchor="start">New or changed control</text>
<text x="56" y="626" font-size="15" fill="#2C2C2A" text-anchor="start">A guide or sensor is added</text>
<text x="56" y="646" font-size="15" fill="#2C2C2A" text-anchor="start">or changed, so the issue is</text>
<text x="56" y="666" font-size="15" fill="#2C2C2A" text-anchor="start">less likely or cannot recur.</text>
<text x="600" y="730" font-size="15" fill="#5F5E5A" font-style="italic" text-anchor="middle">A model's verdict can differ between runs, so it informs the person reviewing; the gate that stops a merge is computational.</text>
