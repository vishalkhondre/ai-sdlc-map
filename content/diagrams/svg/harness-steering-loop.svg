<path d="M628 430H475V410" fill="none" stroke="#993C1D" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#r)"/>
<text x="545" y="470" font-size="14" fill="#5F5E5A" text-anchor="middle">Sensor results let the agent correct itself</text>
