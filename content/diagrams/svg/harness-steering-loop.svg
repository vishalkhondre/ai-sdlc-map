<svg width="1200" height="790" viewBox="0 0 1200 790" xmlns="http://www.w3.org/2000/svg" font-family='"Liberation Sans","DejaVu Sans",Arial,sans-serif' data-references="bockeler-harness bockeler-sensors tw-radar-feedback-sensors"><title>Harness engineering: guides, sensors and the steering loop</title><desc>Guides act before the coding agent works and sensors after it. Left column, guides (feedforward, before the agent acts): computational guides are a project scaffold and an automated code modification; inferential guides are an instruction file and a skill. Both feed the coding agent, in the middle, which writes the change. Right of the agent, sensors (feedback, after the agent acts): computational sensors are validators, tests, linters and type checkers, which give the same result on every run; inferential sensors are a review skill and AI code review, which use a model and are non-deterministic. A dashed arrow from the sensors back to the agent shows that sensor results let the agent correct itself. The last column shows who decides: a computational sensor's result goes to a gate that can stop the merge; an inferential sensor's finding goes to the person reviewing the change as advice, and that person decides. Below, the feedback path, this site's extension of Böckeler's steering loop (running the loop at a retrospective and tracing the lesson upstream are the site's additions), runs from right to left in four steps: a failure recurs (an issue happens more than once, and reviewers see what the agent missed); people run the loop (at the team's usual retrospective, someone asks which control should change); the lesson is traced upstream to the earliest control that could have stopped it, not where it was noticed; and a new or changed control results, a guide or sensor added or changed so the issue is less likely or cannot recur. Arrows return from that step to the guides and the sensors. A footer note says a model's verdict can differ between runs, so it informs the person reviewing, while the gate that stops a merge is computational. A credit line names Böckeler on martinfowler.com as the source of guides and sensors and the steering loop, and of the site's adapted terms: the two kinds of control, validators, the review skill and the feedback path.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#888780" stroke-width="1.6"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#534AB7" stroke-width="1.6"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#993C1D" stroke-width="1.6"/></marker><marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#0F6E56" stroke-width="1.6"/></marker></defs>
