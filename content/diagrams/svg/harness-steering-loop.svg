<line x1="322" y1="250" x2="386" y2="292" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="322" y1="386" x2="386" y2="344" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="562" y1="292" x2="626" y2="252" stroke="#534AB7" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="562" y1="344" x2="626" y2="384" stroke="#534AB7" stroke-width="1.6" marker-end="url(#p)"/>
<line x1="912" y1="250" x2="956" y2="250" stroke="#993C1D" stroke-width="1.6" marker-end="url(#r)"/>
