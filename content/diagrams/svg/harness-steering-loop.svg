<text x="646" y="136" font-size="14" fill="#993C1D" font-weight="700" text-anchor="start" letter-spacing="0.6">SENSORS · FEEDBACK</text>
<text x="646" y="161" font-size="16" fill="#4A1B0C" font-weight="700" text-anchor="start">After the agent acts</text>
<rect x="960" y="110" width="200" height="64" rx="12" fill="#fff" stroke="#888780" stroke-width="1.2"/>
<text x="976" y="136" font-size="14" fill="#5F5E5A" font-weight="700" text-anchor="start" letter-spacing="0.6">WHO DECIDES</text>
<text x="976" y="161" font-size="16" fill="#2C2C2A" font-weight="700" text-anchor="start">Gate or person</text>
<!-- guides -->
<rect x="40" y="190" width="280" height="120" rx="12" fill="#fff" stroke="#888780" stroke-width="1.2"/>
<text x="56" y="216" font-size="14" fill="#5F5E5A" font-weight="700" text-anchor="start" letter-spacing="0.6">COMPUTATIONAL</text>
<text x="56" y="244" font-size="15" fill="#1f1f1c" text-anchor="start">Project scaffold</text>
<text x="56" y="266" font-size="15" fill="#1f1f1c" text-anchor="start">Automated code modification</text>
<rect x="40" y="326" width="280" height="120" rx="12" fill="#fff" stroke="#888780" stroke-width="1.2"/>
<text x="56" y="352" font-size="14" fill="#5F5E5A" font-weight="700" text-anchor="start" letter-spacing="0.6">INFERENTIAL</text>
<text x="56" y="380" font-size="15" fill="#1f1f1c" text-anchor="start">Instruction file</text>
<text x="56" y="402" font-size="15" fill="#1f1f1c" text-anchor="start">Skill</text>
<!-- agent -->
<rect x="390" y="230" width="170" height="176" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/>
<text x="475" y="282" font-size="14" fill="#534AB7" font-weight="700" text-anchor="middle" letter-spacing="0.6">AGENT</text>
<text x="475" y="312" font-size="17" fill="#26215C" font-weight="700" text-anchor="middle">Coding agent</text>
<text x="475" y="338" font-size="15" fill="#26215C" text-anchor="middle">writes the change</text>
<!-- sensors -->
<rect x="630" y="190" width="280" height="120" rx="12" fill="#fff" stroke="#993C1D" stroke-width="1.2"/>
<text x="646" y="216" font-size="14" fill="#993C1D" font-weight="700" text-anchor="start" letter-spacing="0.6">COMPUTATIONAL</text>
<text x="646" y="244" font-size="15" fill="#1f1f1c" text-anchor="start">Validators, tests, linters,</text>
<text x="646" y="266" font-size="15" fill="#1f1f1c" text-anchor="start">type checkers</text>
<text x="646" y="292" font-size="15" fill="#5F5E5A" font-style="italic" text-anchor="start">Same result on every run</text>
<rect x="630" y="326" width="280" height="120" rx="12" fill="#fff" stroke="#993C1D" stroke-width="1.2"/>
<text x="646" y="352" font-size="14" fill="#993C1D" font-weight="700" text-anchor="start" letter-spacing="0.6">INFERENTIAL</text>
<text x="646" y="380" font-size="15" fill="#1f1f1c" text-anchor="start">Review skill,</text>
<text x="646" y="402" font-size="15" fill="#1f1f1c" text-anchor="start">AI code review</text>
<text x="646" y="428" font-size="15" fill="#5F5E5A" font-style="italic" text-anchor="start">Uses a model; non-deterministic</text>
<!-- who decides -->
<rect x="960" y="190" width="200" height="120" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.6"/>
<text x="976" y="222" font-size="17" fill="#4A1B0C" font-weight="700" text-anchor="start">Gate</text>
<text x="976" y="248" font-size="15" fill="#4A1B0C" text-anchor="start">Can stop the merge</text>
<rect x="960" y="326" width="200" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/>
<text x="976" y="356" font-size="17" fill="#04342C" font-weight="700" text-anchor="start">Person reviewing</text>
<text x="976" y="377" font-size="17" fill="#04342C" font-weight="700" text-anchor="start">the change</text>
<text x="976" y="403" font-size="15" fill="#04342C" text-anchor="start">Gets the finding as</text>
<text x="976" y="423" font-size="15" fill="#04342C" text-anchor="start">advice, and decides</text>
