# The section each release covers, and the pages its PDF snapshot prints (D-016).
# Key: major.minor of content/VERSION (follow-ups bump the patch). The tag is "v" + the full edition.
# scripts/release_snapshot.py and .github/workflows/release.yml read this file.
# Keep the keys quoted: unquoted, YAML reads 1.10 as the number 1.1.

"1.2":
  section: "Rename, home page and terminology"
  pages: [index.html, glossary.html]

"1.3":
  section: "An independent site: disconnected, documentation layout, Slate & Teal brand"
  pages: [index.html, glossary.html, workflow-catalog.html, references.html]

"1.4":
  section: "Core: harness engineering, the Engineering Kit and its parts, workflows, the software factory"
  pages: [index.html, harness-engineering.html, engineering-kit.html, rule-registry.html, validators.html, skills-and-evals.html, evidence-schema.html, adapters.html, workflows.html, software-factory.html]

"1.5":
  section: "Lifecycle, part one: the generic levels and SAFe reference model, the seven phase pages, Definition of Ready and Done, the traceability spine and Inspect and Adapt"
  pages: [index.html, lifecycle-levels.html, safe-reference-model.html, idea.html, specification.html, design.html, develop-build-qa.html, deploy.html, release.html, operate.html, definition-of-ready-and-done.html, traceability-spine.html, inspect-and-adapt.html]
