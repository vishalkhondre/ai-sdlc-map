name: Release

# A tag marks the author's approval of a section (D-014, D-016). Pushing tag vX.Y.Z re-runs
# validation on the tagged commit, then creates the GitHub Release with the changelog entry
# as notes and a PDF snapshot of the section's pages.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build site
        run: |
          python site/generate.py
          python scripts/render_diagrams.py
      - name: Release notes and PDF snapshot
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_snapshot.py notes "$TAG" > release-notes.md
          python scripts/release_snapshot.py pdf "$TAG" "ai-sdlc-map-$TAG.pdf"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "ai-sdlc-map-$TAG.pdf" \
            --verify-tag --title "The AI SDLC Map $TAG" --notes-file release-notes.md
